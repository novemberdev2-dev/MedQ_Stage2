<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS_Pathology_All years</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #f1f5f9;
            --header-text: #0f172a;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --correct-color: #f0cf6a;
            --btn-bg: #f8fafc; 
            --btn-text: #0f172a;
            --opts-bg: #1a1c1e;
            --icon-hover-bg: rgba(255,255,255,0.08);
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #fcfcfc;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --correct-color: #2e7d32;
            --btn-bg: #52525b; 
            --btn-text: #ffffff;
            --opts-bg: #eef6e4;
            --icon-hover-bg: rgba(0,0,0,0.06);
        }

        
        @media print {
            body * {
                visibility: hidden !important;
            }
            body::before {
                content: "Printing is disabled for this document.";
                visibility: visible;
                display: block;
                text-align: center;
                margin-top: 40vh;
                font-size: 1.2rem;
            }
        }

        body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

          .theme-toggle,
        .subject-toggle,
        .subject-dropdown-item,
        .eye-btn,
        .icon-btn,
        .copy-btn,
        .pin-btn,
        .draw-btn,
        .answer-text,
        .lecture-select-btn,
        .lecture-dropdown-item,
        .search-toggle-btn,
        .search-close-btn,
        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Show the hand/pointer cursor on every clickable control so it
           doesn't fall back to the default Windows arrow on hover */
        button,
        .theme-toggle,
        .subject-toggle,
        .subject-dropdown-item,
        .eye-btn,
        .icon-btn,
        .copy-btn,
        .pin-btn,
        .draw-btn,
        .lecture-select-btn,
        .lecture-dropdown-item,
        .search-toggle-btn,
        .search-close-btn {
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 12px;
            min-height: 28px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .header {
                align-items: center;
            }
            .header-title-wrap {
                align-items: center;
            }
            .header-title {
                font-size: 0.80rem;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                line-height: 1.4;
                text-align: left;
            }
            .title-line1,
            .title-line2 {
                display: block;
            }
            .title-sep-2 {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .icon-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        /* Remove the divider lines between the search / subject / theme
           icons in the header, without affecting the one used in the
           active-search state (between the search box and close button). */
        #header-normal-right .icon-divider {
            display: none;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 10px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            width: 100%;
            padding: 8px 10px 8px 40px;
            font-size: 1rem;
            border: none;
            background-color: transparent;
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .theme-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 33px;
            height: 33px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-toggle-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .theme-toggle:hover,
        .search-toggle-btn:hover,
        .subject-toggle:hover {
            background-color: var(--icon-hover-bg);
        }

        /* Takeover styles */
        .search-takeover-wrap {
            display: none;
            width: 100%;
            align-items: center;
        }

        .search-takeover-wrap.open {
            display: flex;
        }

        .search-close-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-close-btn:hover {
    background-color: rgba(255,255,255,0.08);
}

[data-theme="light"] .search-close-btn:hover {
    background-color: rgba(0,0,0,0.06);
}

.search-close-btn:focus {
    outline: none;
}

        /* Subject picker dropdown */
        .subject-toggle-wrapper {
            position: relative;
            display: inline-block;
        }

        .subject-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .subject-toggle svg {
            stroke: none !important;
            fill: var(--text-main);
            pointer-events: none;
        }

        .subject-toggle.dropdown-open {
            border-color: rgba(255,255,255,0.3);
            background: rgba(40, 42, 45, 0.9);
        }

        .subject-toggle.dropdown-open svg { fill: var(--text-main); }

        [data-theme="light"] .subject-toggle.dropdown-open {
            border-color: #121212;
            background: rgba(255,255,255,1);
        }

        .subject-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            min-width: 210px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        .subject-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        [data-theme="light"] .subject-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .subject-dropdown-header {
            padding: 10px 10px 10px 16px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        [data-theme="light"] .subject-dropdown-header {
            border-bottom-color: rgba(0,0,0,0.08);
            color: #999;
        }

        /* Cap the list to ~8 rows tall (incl. All); the rest scrolls inside
           the dropdown, and overscroll-behavior stops that scroll from
           chaining into the page once it reaches the end. */
        .subject-dropdown-items {
            max-height: 348px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }

        [data-theme="light"] .subject-dropdown-items {
            scrollbar-color: rgba(0,0,0,0.25) transparent;
        }

        .subject-dropdown-items::-webkit-scrollbar {
            width: 6px;
        }

        .subject-dropdown-items::-webkit-scrollbar-track {
            background: transparent;
        }

        .subject-dropdown-items::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.25);
            border-radius: 6px;
        }

        [data-theme="light"] .subject-dropdown-items::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.25);
        }

        .subject-dropdown-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            text-align: left;
            white-space: nowrap;
        }

        [data-theme="light"] .subject-dropdown-item { color: #666; }

        .subject-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .subject-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .subject-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .subject-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .subject-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .subject-dropdown-item.selected { color: #111; }

        .filter-option-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .filter-option-dot { border-color: rgba(0,0,0,0.2); }

        .subject-dropdown-item.selected .filter-option-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .subject-dropdown-item.selected .filter-option-dot {
            background: #111;
            border-color: #111;
        }

        .controls-row { position: relative; }

        .lecture-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
            flex: 1 1 auto;
        }

        .lecture-select-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            max-width: 100%;
            padding: 4px 6px;
            margin: -4px -6px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .lecture-select-btn:hover {
            background-color: rgba(255,255,255,0.06);
        }

        [data-theme="light"] .lecture-select-btn:hover {
            background-color: rgba(0,0,0,0.04);
        }

        .lecture-chevron {
            flex-shrink: 0;
            color: var(--text-main);
            transition: transform 0.2s ease;
            position: relative;
            top: 2px;
        }

        .lecture-select-btn.dropdown-open .lecture-chevron {
            transform: rotate(180deg);
        }

        .lecture-dropdown {
            position: absolute;
            top: calc(100% + 13px);
            left: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            width: 290px;
            max-width: 80vw;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        

        .lecture-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;

        }

        [data-theme="light"] .lecture-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .lecture-dropdown-header {
            padding: 10px 10px 10px 16px;
            font-size: 0.70rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #777;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.13);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="light"] .lecture-dropdown-header {
            color: #999;
            border-bottom-color: rgba(0,0,0,0.13);
        }

        .dropdown-close-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #888;
            flex-shrink: 0;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .dropdown-close-btn svg {
            width: 13px;
            height: 13px;
            pointer-events: none;
        }

        .dropdown-close-btn:hover {
            background-color: rgba(255,255,255,0.1);
            color: #f1f5f9;
        }

        [data-theme="light"] .dropdown-close-btn:hover {
            background-color: rgba(0,0,0,0.06);
            color: #111;
        }

        /* Cap the list to ~7 rows tall; anything beyond that scrolls
           inside the dropdown instead of growing the page. */
        .lecture-dropdown-items {
            max-height: 329px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }

        [data-theme="light"] .lecture-dropdown-items {
            scrollbar-color: rgba(0,0,0,0.25) transparent;
        }

        .lecture-dropdown-items::-webkit-scrollbar {
            width: 6px;
        }

        .lecture-dropdown-items::-webkit-scrollbar-track {
            background: transparent;
        }

        .lecture-dropdown-items::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.25);
            border-radius: 6px;
        }

        [data-theme="light"] .lecture-dropdown-items::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.25);
        }

        .lecture-dropdown-item {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            text-align: left;
        }

        [data-theme="light"] .lecture-dropdown-item { color: #666; }

        .lecture-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .lecture-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .lecture-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .lecture-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .lecture-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .lecture-dropdown-item.selected { color: #111; }

        .lecture-item-text {
            flex: 1;
            min-width: 0;
            line-height: 1.4;
            white-space: normal;
            word-break: break-word;
            padding-top: 1px;
        }

        .lecture-dot {
            width: 8px;
            height: 8px;
            margin-top: 5px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .lecture-dot { border-color: rgba(0,0,0,0.2); }

        .lecture-dropdown-item.selected .lecture-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .lecture-dropdown-item.selected .lecture-dot {
            background: #111;
            border-color: #111;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            position: relative;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .q-block:last-child { border-bottom: none; }
        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ans-row--multi {
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
        }
        
        .ans-btn:hover {
            opacity: 0.9;
        }
        .ans-btn:active {
            transform: scale(0.98);
        }

        .ans-btn.revealed {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            padding: 7px 12px;
            font-size: 16px;
            white-space: pre-line;
            text-align: left;
        }

        mark { background-color: #f0cf6a; color: #000; }
        .opts li.correct-option { color: var(--correct-color); font-weight: 650; background-color: var( --opts-bg); display: inline-block; padding: 0 7px 0 1px; border-radius: 4px;}
        
        .section-heading {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-heading-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        /* Optional small note shown under the "All" heading on first open,
           above the divider line. Not every file needs one — to remove it,
           just clear the CONTENT_NOTE constant near the top of the script
           (or delete it). */
        .section-note {
            font-size: 0.80rem;
            font-weight: 400;
            line-height: 1.5;
            color: #999;
        }

        [data-theme="light"] .section-note {
            color: #9a9a9a;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.10rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .label-short { display: none; }

        .section-heading-title.subject-title {
            font-size: 1.22rem;
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .section-heading-title {
                font-size: 1rem;
            }
            .section-heading-title.subject-title {
                font-size: 1.12rem;
            }
            .label-full { display: none; }
            .label-short { display: inline; }
        }

        /* Eye / Copy / Pin icon buttons */
        .ans-row {
            justify-content: flex-start !important;
            position: relative;
            z-index: 10;
        }

        .icon-btn, .eye-btn {
            background: transparent;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            transition: background-color 0.2s ease, opacity 0.2s ease, color 0.2s ease;
            margin-top: 20px;
        }

        .icon-btn:hover, .eye-btn:hover {
            background-color: var(--icon-hover-bg);
        }

        .icon-btn svg, .eye-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            fill: currentColor;
        }

        .eye-btn svg.icon-eye-open {
            width: 22px;
            height: 22px;
        }

        .eye-btn[data-revealed="true"] {
            color: var(--correct-color);
        }

        .pin-btn[data-pinned="true"] {
             color: var(--correct-color);
        }

        .eye-part-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eye-part-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-opts);
            opacity: 0.7;
            min-width: 12px;
            text-align: center;
        }

        .answer-text {
            display: none;
            width: 100%;
            box-sizing: border-box;
            background-color: var(--opts-bg);
            color: var(--correct-color);
            font-weight: 800;
            font-size: 15px;
            padding: 7px 12px;
            border-radius: 5px;

        .case-block .answer-text {
            width: auto;
            max-width: 100%;
            white-space: pre-line;
            text-align: left;
            margin-top: 10px;
        }

        .copy-wrap {
            position: relative;
            display: inline-flex;
        }

        .copy-btn svg {
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .copy-btn.copied {
            color: var(--correct-color);
        }

        .copy-btn.copied svg {
            animation: copy-check-pop 0.3s ease;
        }

        @keyframes copy-check-pop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Multi-case questions (e.g. Q29 style) */
        .case-block {
            position: relative;
            margin-top: 14px;
            padding-top: 10px;
        }

        .case-block:first-of-type {
            margin-top: 16px;
        }

        .case-eye-row {
            margin-top: 2px;
        }

        .case-eye-row .eye-btn {
            margin-top: 6px;
        }

        /* Case questions (Q21, Q22): the reveal button itself turns into
           the answer box, instead of showing an open-eye icon plus a
           separate answer box. */
        .case-eye-row .eye-btn.case-answer-revealed {
            display: block;
            width: auto;
            max-width: 100%;
            background-color: var(--opts-bg);
            color: var(--correct-color);
            font-weight: 800;
            font-size: 15px;
            padding: 7px 12px;
            border-radius: 5px;
            white-space: pre-line;
            text-align: left;
            cursor: pointer;
        }

        .case-actions-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            position: relative;
            z-index: 10;
        }

        .case-actions-row .icon-btn {
            margin-top: 0;
        }

        .case-text {
            font-size: 1.02rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        
        .draw-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            touch-action: none;
        }

        .draw-overlay.draw-overlay--outer {
            top: -40px;
            height: calc(100% + 40px);
        }

        .draw-overlay.active {
            pointer-events: auto;
            cursor: crosshair;
            touch-action: none;
        }

        /* While any question's drawing mode is on, block page scrolling so a
           stylus/finger stroke never gets interpreted as a scroll gesture.
           Buttons remain clickable since taps don't trigger this. */
        html.drawing-lock,
        body.drawing-lock {
            touch-action: none;
            overscroll-behavior: none;
        }

        .draw-overlay .draw-path {
            stroke: #ff0000;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

    </style>

const PINNED_QUESTIONS_KEY = 'pinnedQuestions_' + location.pathname;
let pinnedQuestions = new Set(JSON.parse(localStorage.getItem(PINNED_QUESTIONS_KEY) || '[]'));
const originalQuestionsOrder = allQuestions.slice();

function isPinned(n) {
    return pinnedQuestions.has(n);
}

function reorderQuestions() {
    const pinned = originalQuestionsOrder.filter(q => pinnedQuestions.has(q.n));
    const rest = originalQuestionsOrder.filter(q => !pinnedQuestions.has(q.n));
    allQuestions.length = 0;
    allQuestions.push(...pinned, ...rest);
}

function togglePin(n) {
    if (pinnedQuestions.has(n)) {
        pinnedQuestions.delete(n);
    } else {
        pinnedQuestions.add(n);
    }
     localStorage.setItem(PINNED_QUESTIONS_KEY, JSON.stringify([...pinnedQuestions]));
    reorderQuestions();
    try {
        renderQuiz();
    } finally {
        // handleSearch() re-applies the current subject/lecture/search filters
        // to the freshly rendered questions. Running it in a finally block
        // guarantees the list is always re-shown correctly, even if something
        // above throws, instead of getting stuck on "No questions found".
        handleSearch();
    }
}

function copyTextToClipboard(text, btn) {
    function showCopied() {
        if (btn.dataset.copiedTimer) {
            clearTimeout(Number(btn.dataset.copiedTimer));
        }
        btn.classList.add('copied');
        btn.innerHTML = CHECK_SVG;
        const timer = setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = COPY_SVG;
            delete btn.dataset.copiedTimer;
        }, 1000);
        btn.dataset.copiedTimer = String(timer);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            fallbackCopy(text);
            showCopied();
        });
    } else {
        fallbackCopy(text);
        showCopied();
    }
}

function copyQuestion(btn) {
    const block = btn.closest('.q-block');
    const qTextEl = block.querySelector('.q-text');
    const optEls = block.querySelectorAll(':scope > .opts li');
    const qText = (qTextEl.dataset.original || qTextEl.textContent).trim();
    const opts = Array.from(optEls)
        .map(li => (li.dataset.original || li.textContent).trim())
        .filter(Boolean);
    const fullText = opts.length ? `${qText}\n${opts.join('\n')}` : qText;
    copyTextToClipboard(fullText, btn);
}


function copyCase(btn) {
    const qBlock = btn.closest('.q-block');
    const stemEl = qBlock.querySelector('.q-text');
    const stemText = (stemEl.dataset.original || stemEl.textContent).trim();

    const caseBlocks = qBlock.querySelectorAll('.case-block');
    const casesText = Array.from(caseBlocks).map(caseBlock => {
        const caseTextEl = caseBlock.querySelector('.case-text');
        const caseText = (caseTextEl.dataset.original || caseTextEl.textContent).trim();
        const caseOpts = Array.from(caseBlock.querySelectorAll('.opts li'))
            .map(li => (li.dataset.original || li.textContent).trim())
            .filter(Boolean);
        return caseOpts.length ? `${caseText}\n${caseOpts.join('\n')}` : caseText;
    }).join('\n\n');

    const fullText = `${stemText}\n${casesText}`;
    copyTextToClipboard(fullText, btn);
}

/* ---- Per-question pen/eraser drawing ---- */
let activeDrawState = null;
let activeDrawOverlaysCount = 0;

function updateGlobalScrollLock() {
    const locked = activeDrawOverlaysCount > 0;
    document.documentElement.classList.toggle('drawing-lock', locked);
    document.body.classList.toggle('drawing-lock', locked);
}

// Belt-and-braces: even with CSS touch-action:none on the overlay, some
// tablet browsers can still start a page scroll from a stylus/finger drag.
// While drawing mode is on for any question, swallow touchmove so nothing
// but the drawing itself responds to the movement. Taps on buttons are
// unaffected since they don't rely on touchmove.
document.addEventListener('touchmove', function (e) {
    if (activeDrawOverlaysCount > 0) {
        e.preventDefault();
    }
}, { passive: false });

function toggleDraw(btn) {
    const container = btn.closest('.case-block') || btn.closest('.q-block');
    if (!container) return;
    const overlay = container.querySelector(':scope > .draw-overlay');
    const isDrawing = btn.dataset.drawing === "true";

    if (!isDrawing) {
        // Enter drawing mode: pen -> eraser. Other buttons on this question stay usable.
        btn.dataset.drawing = "true";
        btn.innerHTML = ERASER_SVG;
        btn.title = "Erase drawing";
        if (overlay) overlay.classList.add('active');
        activeDrawOverlaysCount++;
        updateGlobalScrollLock();
    } else {
        // Erase: clear the drawing, eraser -> pen
        if (overlay) {
            overlay.innerHTML = '';
            overlay.classList.remove('active');
        }
        btn.dataset.drawing = "false";
        btn.innerHTML = PEN_SVG;
        btn.title = "Draw";
        if (activeDrawState && activeDrawState.svg === overlay) activeDrawState = null;
        activeDrawOverlaysCount = Math.max(0, activeDrawOverlaysCount - 1);
        updateGlobalScrollLock();
    }
}

function getDrawPoint(svg, evt) {
    const rect = svg.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function startDraw(evt) {
    const svg = evt.currentTarget;
    if (!svg.classList.contains('active')) return;
    evt.preventDefault();
    const pt = getDrawPoint(svg, evt);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'draw-path');
    path.setAttribute('d', `M ${pt.x} ${pt.y}`);
    svg.appendChild(path);
    activeDrawState = { svg, path, points: [pt] };
    if (svg.setPointerCapture) {
        try { svg.setPointerCapture(evt.pointerId); } catch (e) {}
    }
}

function moveDraw(evt) {
    if (!activeDrawState || activeDrawState.svg !== evt.currentTarget) return;
    evt.preventDefault();
    const pt = getDrawPoint(activeDrawState.svg, evt);
    activeDrawState.points.push(pt);
    const d = activeDrawState.points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
    activeDrawState.path.setAttribute('d', d);
}

function endDraw(evt) {
    if (activeDrawState && activeDrawState.svg === evt.currentTarget) {
        activeDrawState = null;
    }
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
}

function scrollLectureDropdownToSelected() {
    const wrap = document.querySelector('#lecture-dropdown .lecture-dropdown-items');
    if (!wrap) return;
    const selected = wrap.querySelector('.lecture-dropdown-item.selected');
    if (selected) {
        const target = selected.offsetTop - (wrap.clientHeight / 2) + (selected.clientHeight / 2);
        wrap.scrollTop = Math.max(0, target);
    } else {
        wrap.scrollTop = 0;
    }

function toggleLectureDropdown() {
    const dd = document.getElementById('lecture-dropdown');
    const btn = document.getElementById('lecture-select-btn');
    if (!dd || !btn) return;
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
        dd.classList.remove('open');
        btn.classList.remove('dropdown-open');
        lectureDropdownOpen = false;
    } else {
        dd.classList.add('open');
        btn.classList.add('dropdown-open');
        lectureDropdownOpen = true;
        scrollLectureDropdownToSelected();
    }
}

function closeLectureDropdown() {
    const dd = document.getElementById('lecture-dropdown');
    const btn = document.getElementById('lecture-select-btn');
    if (dd) dd.classList.remove('open');
    if (btn) btn.classList.remove('dropdown-open');

function getLectureLabel(val) {
    if (val === "All" && currentSubjectFilter === "All") return "All";
    if (val === "All") {
        const subjectLabels = {
            "Pathology": "Pathology 🔬",
           
            
        };
        return subjectLabels[currentSubjectFilter] || currentSubjectFilter;
    }
    return lectures[val] || val;
}

function truncateLabel(str, maxLen) {
    const s = String(str);
    return s.length > maxLen ? s.slice(0, maxLen) + "..." : s;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = "No questions found.";
            container.appendChild(noResultsMsg);
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentLecture);
    const shortLabel = truncateLabel(label, 25);
    const labelHtml = `<span class="label-full">${label}</span><span class="label-short">${shortLabel}</span>`;
    const isSubjectLabel = currentLecture === "All";
    const titleClass = "section-heading-title" + (isSubjectLabel ? " subject-title" : "");
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;
    const filters = lectureFilters[currentSubjectFilter] || [];
    const hasLectures = filters.some(f => f.val !== "All");
    if (!hasLectures) lectureDropdownOpen = false;

    const showLectureDropdownOpen = hasLectures && lectureDropdownOpen;
    const headingHtml = hasLectures ? `
        <div class="lecture-select-wrapper" id="lecture-select-wrapper">
            <button class="lecture-select-btn${showLectureDropdownOpen ? ' dropdown-open' : ''}" id="lecture-select-btn" onclick="toggleLectureDropdown()" title="Filter by lecture">
                <span class="${titleClass}">${labelHtml}</span>
                ${LECTURE_CHEVRON_SVG}
            </button>
            <div class="lecture-dropdown${showLectureDropdownOpen ? ' open' : ''}" id="lecture-dropdown"><div class="lecture-dropdown-header"><span>Lectures</span><button type="button" class="dropdown-close-btn" onclick="closeLectureDropdown()" title="Close" aria-label="Close">${CLOSE_ICON_SVG}</button></div><div class="lecture-dropdown-items">${renderLectureDropdownItems()}</div></div>
        </div>
        <span class="mcq-count-badge">${badgeText}</span>
    ` : `
        <span class="${titleClass}">${labelHtml}</span>
        <span class="mcq-count-badge">${badgeText}</span>
    `;

    const headingRowHtml = `<div class="section-heading-row">${headingHtml}</div>`;

    let heading;
    if (existing) {
        existing.style.display = "flex";
        existing.innerHTML = headingRowHtml;
        heading = existing;
    } else {
        heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = headingRowHtml;
        container.insertBefore(heading, container.firstChild);
    }

    if (showLectureDropdownOpen) scrollLectureDropdownToSelected();

    // Show the optional note only on the default "All" view (no subject or
    // lecture filter applied) — i.e. what you see when the file first opens.
    // It sits inside the heading block, below the title and above the
    // divider line underneath it.
    const showNote = !!CONTENT_NOTE && currentLecture === "All";
    if (showNote) {
        const noteEl = document.createElement('div');
        noteEl.id = 'section-note';
        noteEl.className = 'section-note';
        noteEl.textContent = CONTENT_NOTE;
        heading.appendChild(noteEl);
    }
}

function renderCaseHtml(caseItem, mainN) {

function renderQuiz() {
    container.innerHTML = '';
    activeDrawState = null;
    activeDrawOverlaysCount = 0;
    updateGlobalScrollLock();
    allQuestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.subject = item.s;
        div.dataset.lecture = item.l ?? "";

        const isCaseQuestion = Array.isArray(item.cases) && item.cases.length > 0;

        div.dataset.searchText = isCaseQuestion
            ? (item.q + " " + item.cases.map(c => c.text + " " + (c.o || []).join(" ")).join(" ")).toLowerCase()
            : (item.q + " " + item.o.join(" ")).toLowerCase();

        div.style.display = matchesFilters(item) ? "block" : "none";

        if (isCaseQuestion) {
            div.innerHTML = `
                <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
                ${item.cases.map(c => renderCaseHtml(c, item.n)).join('')}
                ${renderCaseActionsHtml(item.n)}
            `;
            container.appendChild(div);
            return;
        }

        const isMulti = Array.isArray(item.a);
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        const isEssay = !item.o || item.o.length === 0 || (item.o.length === 1 && item.o[0].trim() === "");

        const iconsRowHtml = isMulti
            ? item.a.map((part, i) => {
                const label = `Answer ${letters[i] || (i + 1)}`;
                const revealText = isEssay ? part : '';
                return `
                <div class="eye-part-row">
                    <span class="eye-part-label">${letters[i] || (i + 1)}</span>
                    <button class="eye-btn" data-label="${label}" data-answer="${escapeAttr(revealText)}" data-essay="${isEssay}" data-correct="${escapeAttr(part)}" data-revealed="false" onclick="toggleAnswer(this)" title="${label}">${EYE_HIDE_SVG}</button>
                </div>`;
              }).join('') + `
                <div class="eye-part-row">
                    <div class="copy-wrap">
                        <button class="icon-btn copy-btn" onclick="copyQuestion(this)" title="Copy question">${COPY_SVG}</button>
                    </div>
                    <button class="icon-btn pin-btn" data-pinned="${isPinned(item.n)}" onclick="togglePin(${item.n})" title="${isPinned(item.n) ? 'Unpin question' : 'Pin question'}">${isPinned(item.n) ? UNPIN_SVG : PIN_SVG}</button>
                    <button class="icon-btn draw-btn" data-drawing="false" onclick="toggleDraw(this)" title="Draw">${PEN_SVG}</button>
                </div>`
            : `
                <button class="eye-btn" data-label="Answer" data-answer="${escapeAttr(isEssay ? item.a : '')}" data-essay="${isEssay}" data-correct="${escapeAttr(item.a)}" data-revealed="false" onclick="toggleAnswer(this)" title="Show answer">${EYE_HIDE_SVG}</button>
                <div class="copy-wrap">
                    <button class="icon-btn copy-btn" onclick="copyQuestion(this)" title="Copy question">${COPY_SVG}</button>
                </div>
                <button class="icon-btn pin-btn" data-pinned="${isPinned(item.n)}" onclick="togglePin(${item.n})" title="${isPinned(item.n) ? 'Unpin question' : 'Pin question'}">${isPinned(item.n) ? UNPIN_SVG : PIN_SVG}</button>
                <button class="icon-btn draw-btn" data-drawing="false" onclick="toggleDraw(this)" title="Draw">${PEN_SVG}</button>`;

        div.innerHTML = `
            <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            ${isEssay ? `<div class="answer-text"></div>` : ''}
            <div class="ans-row${isMulti ? ' ans-row--multi' : ''}">
                ${iconsRowHtml}
            </div>
            <svg class="draw-overlay draw-overlay--outer" onpointerdown="startDraw(event)" onpointermove="moveDraw(event)" onpointerup="endDraw(event)" onpointerleave="endDraw(event)" onpointercancel="endDraw(event)"></svg>
        `;
        container.appendChild(div);
    });
    updateSectionHeading();
}

document.addEventListener("keydown", function(e) {
    const key = e.key ? e.key.toLowerCase() : '';
    const ctrlOrCmd = e.ctrlKey || e.metaKey;

    // Ctrl/Cmd + S (Save)
    if (ctrlOrCmd && key === 's') {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl/Cmd + P (Print)
    if (ctrlOrCmd && key === 'p') {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    if (e.key === "Escape") {
        const takeover = document.getElementById('search-takeover-wrap');
        if (takeover && takeover.classList.contains('open')) {
            closeSearchBar();
        }
    }
});

// Catch printing triggered via the browser's Print menu / window.print()
window.addEventListener('beforeprint', function (e) {
    document.title = 'Printing disabled';
});

function matchesFilters(item) {
    const subjectOk = currentSubjectFilter === "All" || item.s === currentSubjectFilter;
    const lectureOk = currentLecture === "All" || String(item.l) === String(currentLecture);
    return subjectOk && lectureOk;
}

/* Premium Full Header Takeover Functions */
function toggleSearchBar() {
    const takeover = document.getElementById('search-takeover-wrap');
    const normalLeft = document.getElementById('header-normal-left');
    const normalRight = document.getElementById('header-normal-right');
    const input = document.getElementById('search-input');

    normalLeft.style.display = 'none';
    normalRight.style.display = 'none';
    takeover.classList.add('open');
    
    setTimeout(() => input.focus(), 50);
}

function closeSearchBar() {
    const takeover = document.getElementById('search-takeover-wrap');
    const normalLeft = document.getElementById('header-normal-left');
    const normalRight = document.getElementById('header-normal-right');
    const input = document.getElementById('search-input');

    takeover.classList.remove('open');
    normalLeft.style.display = 'flex';
    normalRight.style.display = 'flex';
    
    input.value = '';
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');
    blocks.forEach(block => {
        resetBlock(block);
        const subjectOk = currentSubjectFilter === "All" || block.dataset.subject === currentSubjectFilter;
        const lectureOk = currentLecture === "All" || String(block.dataset.lecture) === String(currentLecture);
        const matchesSearch = term === "" || block.dataset.searchText.includes(term);
        if (subjectOk && lectureOk && matchesSearch) {
            block.style.display = "block";
            if (term !== "") highlight(block, term);
        } else {
            block.style.display = "none";
        }
    });
    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => { li.innerHTML = li.dataset.original; li.classList.remove('correct-option'); });
    block.querySelectorAll('.case-text').forEach(ct => {
        ct.innerHTML = ct.dataset.original;
    });
    block.querySelectorAll('.eye-btn').forEach(btn => {
        btn.dataset.revealed = "false";
        btn.classList.remove('case-answer-revealed');
        btn.innerHTML = EYE_HIDE_SVG;
        btn.title = 'Show answer';
    });
    block.querySelectorAll('.answer-text').forEach(textEl => {
        textEl.textContent = '';
        textEl.style.display = 'none';
    });
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('.case-text').forEach(ct => ct.innerHTML = ct.innerHTML.replace(regex, '<mark>$1</mark>'));
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function toggleAnswer(btn) {
    const isRevealed = btn.dataset.revealed !== "true";
    btn.dataset.revealed = isRevealed ? "true" : "false";

    // Scope to the case-block if this button belongs to one sub-case of a
    // multi-case question, otherwise fall back to the whole question block.
    const isCase = !!btn.closest('.case-block');
    const scope = btn.closest('.case-block') || btn.closest('.q-block');

    if (btn.dataset.essay === "true") {
        if (isCase) {
            // Case questions (Q21, Q22): the button itself becomes the
            // answer box, without showing the open-eye icon.
            btn.classList.toggle('case-answer-revealed', isRevealed);
            btn.innerHTML = isRevealed ? btn.dataset.answer : EYE_HIDE_SVG;
            btn.title = isRevealed ? '' : 'Show answer';
            return;
        }

        btn.innerHTML = isRevealed ? EYE_SHOW_SVG : EYE_HIDE_SVG;
        const textEl = scope.querySelector('.answer-text');
        if (textEl) {
            textEl.textContent = isRevealed ? btn.dataset.answer : '';
            textEl.style.display = isRevealed ? 'block' : 'none';
        }
        return;
    }

    btn.innerHTML = isRevealed ? EYE_SHOW_SVG : EYE_HIDE_SVG;

    const correctLetters = (btn.dataset.correct || '')
        .split(/[,\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

    scope.querySelectorAll('.opts li').forEach(li => {
        const original = li.dataset.original || li.textContent;
        const letter = original.split('.')[0].trim();
        if (correctLetters.includes(letter)) {
            li.classList.toggle('correct-option', isRevealed);
        }
    });
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
}());

reorderQuestions();
renderQuiz();



</script>
