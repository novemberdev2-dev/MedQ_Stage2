<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSD_Final2_2021-2022</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #f1f5f9;
            --header-text: #0f172a;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --correct-color: #2e7d32;
            --btn-bg: #f8fafc; 
            --btn-text: #0f172a;
            
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #fcfcfc;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --correct-color: #e53935;
            --btn-bg: #52525b; 
            --btn-text: #ffffff;
            
        }

      .filter-btn.active {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        body {
            -webkit-user-select: none;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px;
           min-height: 28px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .header {
                align-items: flex-start;
                text-align: left;
            }
            .header-title-wrap {
                align-items: flex-start;
            }
            .header-title {
                font-size: 0.80rem;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                line-height: 1.4;
                text-align: left;
            }
            .title-line1,
            .title-line2 {
                display: block;
            }
            .title-sep-2 {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .icon-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 10px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            border-radius: 7px;
        }

        .search-wrapper .search-icon-svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            padding: 10px 10px 10px 40px;
            font-size: 1.1rem;
            border: none;
            background-color: transparent;
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .search-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .theme-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-toggle-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-bar-expand {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-bar-expand.open {
            display: flex;
        }

        .search-close-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .filter-container {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            max-width: 100%;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        /* Subject picker dropdown */
        .subject-toggle-wrapper {
            position: relative;
            display: inline-block;
        }

        .subject-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .subject-toggle svg {
            stroke: none !important;
            fill: var(--text-main);
            pointer-events: none;
        }

        .subject-toggle.dropdown-open {
            border-color: rgba(255,255,255,0.3);
            background: rgba(40, 42, 45, 0.9);
        }

        .subject-toggle.dropdown-open svg { fill: var(--text-main); }

        [data-theme="light"] .subject-toggle.dropdown-open {
            border-color: #121212;
            background: rgba(255,255,255,1);
        }

        .subject-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            min-width: 210px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        .subject-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        [data-theme="light"] .subject-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .subject-dropdown-header {
            padding: 14px 16px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        [data-theme="light"] .subject-dropdown-header {
            border-bottom-color: rgba(0,0,0,0.08);
            color: #999;
        }

        .subject-dropdown-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
        }

        [data-theme="light"] .subject-dropdown-item { color: #666; }

        .subject-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .subject-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .subject-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .subject-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .subject-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .subject-dropdown-item.selected { color: #111; }

        .filter-option-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .filter-option-dot { border-color: rgba(0,0,0,0.2); }

        .subject-dropdown-item.selected .filter-option-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .subject-dropdown-item.selected .filter-option-dot {
            background: #111;
            border-color: #111;
        }

        .controls-row { position: relative; }

        .filter-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
            margin-bottom: 10px;
            margin-top: 6px;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .q-block:last-child { border-bottom: none; }
        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ans-row--multi {
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
        }
.ans-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 7px 20px;
            border-radius: 5px; 
            margin-top: 20px;
            font-weight: 650;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
        }


        .ans-btn:hover {
            opacity: 0.9;
        }
        .ans-btn:active {
            transform: scale(0.98);
        }

        .ans-btn.revealed {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            padding: 7px 12px;
            font-size: 16px;
            white-space: pre-line;
            text-align: left;
        }

        mark { background-color: #f0cf6a; color: #000; }
.opts li.correct-option { color: var(--correct-color); font-weight: 500; }
        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
    </style>

</head>

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

</div>

<script>

const allQuestions = [
 

{ n: 1, s: "Microbiology", l: 1, q: "Which form of Leishmania is typically identified in human tissue during the diagnostic stage of leishmaniasis?", o: ["A. Promastigote", "B. Epimastigote", "C. Amastigote", "D. Trypomastigote", "E. Sporozoite"], a: "C" },

{ n: 5, s: "Radiology", l: 1, q: "Which imaging modality provides real-time multiplanar imaging but is highly dependent on the skill of the operator?", o: ["A. Computed Tomography (CT)", "B. Magnetic Resonance Imaging (MRI)", "C. Plain Radiography", "D. Ultrasound", "E. Nuclear Bone Scan"], a: "D" },
{ n: 6, s: "Physiology", l: 1, q: "In the structural organization of a skeletal muscle sarcomere, the H zone contains which of the following?", o: ["A. Actin filaments only", "B. Myosin filaments only", "C. Both actin and myosin filaments", "D. Tropomyosin and troponin complexes", "E. Desmin filaments only"], a: "B" },
{ n: 7, s: "Pharmacology", l: 1, q: "Sugammadex is used as an antidote to reverse the neuromuscular blockade produced by which drug?", o: ["A. Succinylcholine", "B. Rocuronium", "C. Pancuronium", "D. Cisatracurium", "E. Tubocurarine"], a: "B" },
{ n: 8, s: "Radiology", l: 1, q: "Which imaging modality is excellent for evaluating soft tissues while exposing the patient to zero ionizing radiation?", o: ["A. Magnetic Resonance Imaging (MRI) ", "B. Computed Tomography (CT)", "C. Fluoroscopy", "D. Conventional X-ray", "E. Positron Emission Tomography (PET)"], a: "A" },

{ n: 10, s: "Histology", l: 1, q: "In which layer of the epidermis are active, melanin-producing melanocytes anatomically located?", o: ["A. Stratum corneum", "B. Stratum lucidum", "C. Stratum granulosum", "D. Stratum spinosum", "E. Stratum basale"], a: "E" },
{ n: 11, s: "Biochemistry", l: 1, q: "Severe hypophosphatemia is a classic metabolic or biochemical abnormality frequently caused by:", o: ["A. Hypoparathyroidism", "B. Hypothyroidism ", "C. Chronic renal failure", "D. Vitamin D toxicity", "E. Hyperparathyroidism"], a: "E" },
{ n: 12, s: "Microbiology", l: 1, q: "Tinea pedis is commonly known by which of the following names?", o: ["A. Ringworm of the hand", "B. Athlete's foot", "C. Jock itch", "D. Barber's itch", "E. Shingles"], a: "B" },
{ n: 13, s: "Dermatology", l: 1, q: "A mutation in which protein is most strongly associated with the development of atopic eczema?", o: ["A. Collagen type I", "B. Elastin", "C. Filaggrin", "D. Laminin", "E. Fibronectin"], a: "C" },
{ n: 14, s: "Microbiology", l: 1, q: "A superficial dermatophyte infection that specifically affects the scalp hair and skin is known clinically as:", o: ["A. Tinea corporis", "B. Tinea cruris", "C. Tinea unguium", "D. Tinea capitis", "E. Tinea pedis"], a: "D" },
{ n: 15, s: "Radiology", l: 1, q: "Which imaging modality is most sensitive for detecting early bone metastasis and assessing overall skeletal metabolic activity?", o: ["A. Radioactive bone scan (scintigraphy)", "B. Plain radiograph skeletal survey", "C. Ultrasound", "D. Computed Tomography (CT) without contrast", "E. Dual-energy X-ray absorptiometry (DEXA)"], a: "A" },
{ n: 16, s: "Histology", l: 1, q: "In which layer of the epidermis does active cell replication primarily occur?", o: ["A. Stratum corneum", "B. Stratum basale", "C. Stratum granulosum", "D. Stratum lucidum", "E. Stratum spinosum"], a: "B" },
{ n: 17, s: "Histology", l: 1, q: "Which type of epithelium lines the ducts of sweat glands?", o: ["A. Simple squamous epithelium", "B. Simple columnar epithelium", "C. Pseudostratified columnar epithelium", "D. Transitional epithelium", "E. Stratified cuboidal epithelium"], a: "E" },
{ n: 18, s: "Medicine", l: 1, q: "In medical sociology and bioethics, core beliefs and practices regarding health are heavily shaped by the values of the:", o: ["A. Pharmaceutical corporations", "B. Hospital administrative boards", "C. Medical insurance underwriters", "D. Legal and court systems", "E. Family and community"], a: "E" },
{ n: 19, s: "Pathology", l: 1, q: "Which of the following clinical findings is NOT typical of Osteogenesis Imperfecta (brittle bone disease)?", o: ["A. Blue sclerae", "B. Multiple bone fractures", "C. Hearing loss", "D. Hyperextensibility of skin", "E. Dentinogenesis imperfecta"], a: "D" },
{ n: 20, s: "Medicine", l: 1, q: "A 2-year-old boy presents with physiological bowing of both legs. X-ray confirms no bone deformity, and his weight is at the 50th percentile. What is the most appropriate management?", o: ["A. Reassuring the parents", "B. Surgical osteotomy", "C. High-dose Vitamin D therapy ", "D. Rigid corrective leg braces", "E. Total dietary calcium restriction"], a: "A" },
{ n: 21, s: "Pathology", l: 1, q: "Vitamin D₃ deficiency in children most commonly results in which condition?", o: ["A. Osteitis fibrosa cystica", "B. Osteopetrosis", "C. Rickets", "D. Paget disease", "E. Osteochondroma"], a: "C" },
{ n: 22, s: "Anatomy", l: 1, q: "Which movement of the vertebral column is primarily assessed by observing the alignment of the spinous processes?", o: ["A. Flexion", "B. Extension", "C. Lateral flexion", "D. Rotation", "E. Circumduction"], a: "D" },
{ n: 23, s: "Radiology", l: 1, q: "A chest radiograph that appears diffusely light, where the thoracic spine is not visible behind the heart shadow, is considered:", o: ["A. Under-penetrated", "B. Over-penetrated", "C. Correctly exposed", "D. Rotated to the left", "E. Taken during expiration"], a: "A" },
{ n: 24, s: "Radiology", l: 1, q: "A chest radiograph where the vertebral bodies are clearly seen through the cardiac silhouette represents a technically acceptable state of:", o: ["A. Extreme under-penetration", "B. Patient motion artifact ", "C. Poor inspiratory effort", "D. Severe apical lordosis", "E. Good and over-penetration balance"], a: "E" },
{ n: 25, s: "Medicine", l: 1, q: "A 2-year-old child presents with a completely symmetric bow leg appearance. This presentation is most likely:", o: ["A. Pathological rickets", "B. Blount disease", "C. Physiological bowing", "D. Asymmetric skeletal dysplasia", "E. Congenital syphilis"], a: "C" },
{ n: 26, s: "Anatomy", l: 1, q: "Which of the following quadriceps femoris muscles crosses both the hip and knee joints, acting as a flexor of the hip?", o: ["A. Vastus lateralis", "B. Vastus medialis", "C. Vastus intermedius", "D. Rectus femoris", "E. Sartorius"], a: "D" },
{ n: 27, s: "Physiology", l: 1, q: "Which ion triggers the release of neurotransmitters from the presynaptic nerve terminal?", o: ["A. Calcium ion", "B. Potassium ion", "C. Sodium ion ", "D. Chloride ion", "E. Magnesium ion"], a: "A" },
{ n: 28, s: "Pharmacology", l: 1, q: "Which of the following medications is classified as a long-acting beta2-adrenergic agonist (LABA) used in asthma management?", o: ["A. Albuterol", "B. Salbutamol", "C. Formoterol", "D. Terbutaline", "E. Ipratropium"], a: "C" },
{ n: 29, s: "Physiology", l: 1, q: "A motor unit is physiologically defined as which of the following?", o: ["A. All the motor neurons innervating a single muscle", "B. A single motor neuron and all the muscle fibres it innervates", "C. A single myofibril and its sarcoplasmic reticulum", "D. The entire collection of muscles within a fascial compartment", "E. One muscle fiber and its sensory muscle spindle"], a: "B" },
{ n: 30, s: "Medicine", l: 1, q: "Which toxic, suffocating chemical substance is characterized as a greenish-yellow gas with a pungent, irritating odor?", o: ["A. Carbon monoxide", "B. Carbon dioxide", "C. Chlorine", "D. Nitrogen dioxide", "E. Sulfur dioxide"], a: "C" },
{ n: 31, s: "Microbiology", l: 1, q: "The virulence factor pyocyanin, produced by Pseudomonas aeruginosa, damages respiratory epithelium by stimulating the release of:", o: ["A. Interleukin-8", "B. Interleukin-4", "C. Interferon-gamma", "D. Tumor necrosis factor-beta", "E. Transforming growth factor-beta"], a: "A" },
{ n: 32, s: "Pharmacology", l: 1, q: "Which of the following medications is the specific life-saving drug of choice used to treat malignant hyperthermia?", o: ["A. Succinylcholine", "B. Atropine", "C. Rocuronium", "D. Sugammadex", "E. Dantrolene"], a: "E" },
{ n: 33, s: "Pharmacology", l: 1, q: "Allopurinol reduces serum uric acid levels in gout patients by inhibiting which of the following enzymes?", o: ["A. Cyclooxygenase", "B. Xanthine oxidase", "C. Phospholipase A2", "D. Plasminogen activator", "E. Dihydrofolate reductase"], a: "B" },
{ n: 34, s: "Pharmacology", l: 1, q: "Which enzyme catalyzes the conversion of xanthine to uric acid?", o: ["A. Adenosine deaminase", "B. HGPRT", "C. Xanthine oxidase", "D. Urate oxidase", "E. PRPP synthetase"], a: "C" },
{ n: 35, s: "Medicine", l: 1, q: "A 25-year-old woman presents with a painful swelling in the inguinal region accompanied by fever. What is the most likely diagnosis?", o: ["A. Femoral hernia", "B. Infected inguinal hernia", "C. Inguinal lymphadenitis", "D. Lipoma of the groin", "E. Saphena varix"], a: "B" },
{ n: 36, s: "Physiology", l: 1, q: "Localized or generalized tissue edema can occur due to an alteration in fluid dynamics. Which of the following is a cause of edema?", o: ["A. Increased plasma oncotic pressure", "B. Decreased capillary hydrostatic pressure", "C. Decrease in lymphatic drainage", "D. Severe vasoconstriction of all arterioles", "E. Decreased total blood volume"], a: "C" },



];


const lectures = {
   1:  "Centrally acting Muscle relaxants",
   2:  "Bone health and Osteoporosis",
   
};
  
const lectureFilters = {
    "All": [],
    "Pharmacology": [
        { label: "All",                            val: "All" },
        
        { label: "Centrally acting Muscle relaxants",     val: 1 },
        { label: "Bone health and Osteoporosis",     val: 2 },
      

 ],

 


};
let currentSubjectFilter = "All";  // default
let currentLecture = "All";

const container = document.getElementById('quiz-content');
const filterBar = document.getElementById('filter-bar');

function renderFilterBar() {
    const filters = lectureFilters[currentSubjectFilter] || lectureFilters["All"];
    filterBar.innerHTML = filters.map(f =>
        `<button class="filter-btn${f.val === currentLecture ? " active" : ""}" onclick="filterByLecture('${f.val}', this)">${f.label}</button>`
    ).join('');
}

function getLectureLabel(val) {
    if (val === "All" && currentSubjectFilter === "All") return "All";
    if (val === "All") {
        const subjectLabels = {
    "Anatomy": "Anatomy 🦴",
    "Physiology": "Physiology ⚡",
    "Microbiology": "Microbiology 🦠",
    "Pharmacology": "Pharmacology 💊",
    "Biochemistry": "Biochemistry 🧪",
    "Pathology": "Pathology 🔬",
    "Genetics": "Genetics 🧬",
    "Dermatology": "Dermatology ✨",
    "Histology": "Histology 🫁",
    "Community Medicine": "Community Medicine 📕",
    "Radiology": "Radiology ☢️"
};
 return subjectLabels[currentSubjectFilter] || currentSubjectFilter;
    }
    return lectures[val] || val;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = "No questions found.";
            container.appendChild(noResultsMsg);
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentLecture);
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;

    if (existing) {
        existing.style.display = (count === 0) ? "none" : "flex";
        existing.querySelector('.section-heading-title').textContent = label;
        existing.querySelector('.mcq-count-badge').textContent = badgeText;
    } else if (count > 0) {
        const heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = `<span class="section-heading-title">${label}</span><span class="mcq-count-badge">${badgeText}</span>`;
        container.insertBefore(heading, container.firstChild);
    }
}

function renderQuiz() {
    container.innerHTML = '';
    allQuestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.subject = item.s;
        div.dataset.lecture = item.l ?? "";
        div.dataset.searchText = (item.q + " " + item.o.join(" ")).toLowerCase();

        div.style.display = matchesFilters(item) ? "block" : "none";

        // If item.a is an array, render one button per element (Answer A, Answer B, ...).
        // If item.a is a plain string, render the normal single "Answer" button.
        // This is purely structural -- no need for "A."/"B." text in the answer itself.
        const isMulti = Array.isArray(item.a);
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

        // Essay questions have no real options (o is empty or just [""]).
        // For those, show just the answer text -- no "Answer:" prefix.
        const isEssay = !item.o || item.o.length === 0 || (item.o.length === 1 && item.o[0].trim() === "");

        const answerButtonsHtml = isMulti
            ? item.a.map((part, i) => {
                const label = `Answer ${letters[i] || (i + 1)}`;
                const revealText = isEssay ? part : `Answer: ${part}`;
                return `<button class="ans-btn" data-label="${label}" data-answer="${escapeAttr(revealText)}" data-essay="${isEssay}" data-correct="${escapeAttr(part)}" onclick="toggleAnswer(this)">${label}</button>`;
              }).join('')
            : `<button class="ans-btn" data-label="Answer" data-answer="${escapeAttr(isEssay ? item.a : 'Answer: ' + item.a)}" data-essay="${isEssay}" data-correct="${escapeAttr(item.a)}" onclick="toggleAnswer(this)">Answer</button>`;

        div.innerHTML = `
            <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            <div class="ans-row${isMulti ? ' ans-row--multi' : ''}">
                ${answerButtonsHtml}
            </div>
        `;
        container.appendChild(div);
    });
    updateSectionHeading();
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
    }
});

function matchesFilters(item) {
    const subjectOk = currentSubjectFilter === "All" || item.s === currentSubjectFilter;
    const lectureOk = currentLecture === "All" || item.l === currentLecture;
    return subjectOk && lectureOk;
}

function filterByLecture(val, btn) {
    currentLecture = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    handleSearch();
}

// Subject dropdown logic
function toggleSubjectDropdown() {
    const dd = document.getElementById('subject-dropdown');
    const btn = document.getElementById('subject-toggle-btn');
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
        dd.classList.remove('open');
        btn.classList.remove('dropdown-open');
    } else {
        dd.classList.add('open');
        btn.classList.add('dropdown-open');
    }
}

function selectSubjectFilter(subject, el) {
    currentSubjectFilter = subject;
    currentLecture = "All";
    localStorage.setItem('selectedSubject', subject);
    // update selected state in dropdown
    document.querySelectorAll('.subject-dropdown-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    // keep dropdown open — do NOT close it
    // re-render filter bar and quiz
    renderFilterBar();
    handleSearch();
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.subject-toggle-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('subject-dropdown').classList.remove('open');
        document.getElementById('subject-toggle-btn').classList.remove('dropdown-open');
    }
});

function toggleSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    const isOpen = bar.classList.contains('open');
    if (isOpen) {
        closeSearchBar();
    } else {
        bar.classList.add('open');
        document.getElementById('search-input').focus();
    }
}

function closeSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    bar.classList.remove('open');
    const input = document.getElementById('search-input');
    input.value = '';
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');
    blocks.forEach(block => {
        resetBlock(block);
        const subjectOk = currentSubjectFilter === "All" || block.dataset.subject === currentSubjectFilter;
        const lectureOk = currentLecture === "All" || String(block.dataset.lecture) === String(currentLecture);
        const matchesSearch = term === "" || block.dataset.searchText.includes(term);
        if (subjectOk && lectureOk && matchesSearch) {
            block.style.display = "block";
            if (term !== "") highlight(block, term);
        } else {
            block.style.display = "none";
        }
    });
    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => { li.innerHTML = li.dataset.original; li.classList.remove('correct-option'); });
    block.querySelectorAll('.ans-btn').forEach(btn => {
        btn.classList.remove('revealed');
        btn.dataset.revealed = "false";
        if (btn.dataset.answer) btn.textContent = btn.dataset.label;
    });
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function toggleAnswer(btn) {
    // Essay questions have no real options to highlight, so keep the original
    // behavior of revealing the answer text directly on the button.
    if (btn.dataset.essay === "true") {
        const isRevealed = btn.classList.toggle('revealed');
        btn.textContent = isRevealed ? btn.dataset.answer : btn.dataset.label;
        return;
    }

    // MCQ questions: keep all options the same color, and instead of showing
    // the answer on the button, color the correct option(s) red and turn the
    // button into a "Hide" button. The button's own appearance should not
    // change, only its text, so we track state via a data attribute rather
    // than the styled 'revealed' class.
    const isRevealed = btn.dataset.revealed !== "true";
    btn.dataset.revealed = isRevealed ? "true" : "false";
    const block = btn.closest('.q-block');
    const correctLetters = (btn.dataset.correct || '')
        .split(/[,\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

    block.querySelectorAll('.opts li').forEach(li => {
        const original = li.dataset.original || li.textContent;
        const letter = original.split('.')[0].trim();
        if (correctLetters.includes(letter)) {
            li.classList.toggle('correct-option', isRevealed);
        }
    });

    btn.textContent = isRevealed ? btn.dataset.label.replace('Answer', 'Hide') : btn.dataset.label;
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    // Restore saved subject (default: Biochemistry)
    const saved = localStorage.getItem('selectedSubject');
    if (saved && lectureFilters[saved]) {
        currentSubjectFilter = saved;
    }
    // Mark the correct dropdown item as selected
    document.querySelectorAll('.subject-dropdown-item').forEach(item => {
        if (item.dataset.subject === currentSubjectFilter) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
}());

renderFilterBar();
renderQuiz();
</script>
