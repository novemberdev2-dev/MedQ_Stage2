<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVS_End-Block_Theory_2025-2026</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #f1f5f9;
            --header-text: #0f172a;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --correct-color: #2e7d32;
            --btn-bg: #f8fafc; 
            --btn-text: #0f172a;
            
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #fcfcfc;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --correct-color: #e53935;
            --btn-bg: #52525b; 
            --btn-text: #ffffff;
            
        }

      .filter-btn.active {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        body {
            -webkit-user-select: none;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px;
           min-height: 28px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .header {
                align-items: flex-start;
                text-align: left;
            }
            .header-title-wrap {
                align-items: flex-start;
            }
            .header-title {
                font-size: 0.80rem;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                line-height: 1.4;
                text-align: left;
            }
            .title-line1,
            .title-line2 {
                display: block;
            }
            .title-sep-2 {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .icon-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 10px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            width: 100%;
            padding: 10px 10px 10px 40px;
            font-size: 1.1rem;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .theme-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-toggle-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-bar-expand {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-bar-expand.open {
            display: flex;
        }

        .search-close-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .filter-container {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            max-width: 100%;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        /* Subject picker dropdown */
        .subject-toggle-wrapper {
            position: relative;
            display: inline-block;
        }

        .subject-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .subject-toggle svg {
            stroke: none !important;
            fill: var(--text-main);
            pointer-events: none;
        }

        .subject-toggle.dropdown-open {
            border-color: rgba(255,255,255,0.3);
            background: rgba(40, 42, 45, 0.9);
        }

        .subject-toggle.dropdown-open svg { fill: var(--text-main); }

        [data-theme="light"] .subject-toggle.dropdown-open {
            border-color: #121212;
            background: rgba(255,255,255,1);
        }

        .subject-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            min-width: 210px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        .subject-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        [data-theme="light"] .subject-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .subject-dropdown-header {
            padding: 14px 16px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        [data-theme="light"] .subject-dropdown-header {
            border-bottom-color: rgba(0,0,0,0.08);
            color: #999;
        }

        .subject-dropdown-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
        }

        [data-theme="light"] .subject-dropdown-item { color: #666; }

        .subject-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .subject-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .subject-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .subject-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .subject-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .subject-dropdown-item.selected { color: #111; }

        .filter-option-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .filter-option-dot { border-color: rgba(0,0,0,0.2); }

        .subject-dropdown-item.selected .filter-option-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .subject-dropdown-item.selected .filter-option-dot {
            background: #111;
            border-color: #111;
        }

        .controls-row { position: relative; }

        .filter-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
            margin-bottom: 10px;
            margin-top: 6px;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .q-block:last-child { border-bottom: none; }
        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ans-row--multi {
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
        }
.ans-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 7px 20px;
            border-radius: 5px; 
            margin-top: 20px;
            font-weight: 650;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
        }


        .ans-btn:hover {
            opacity: 0.9;
        }
        .ans-btn:active {
            transform: scale(0.98);
        }

        .ans-btn.revealed {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            padding: 7px 12px;
            font-size: 16px;
            white-space: pre-line;
            text-align: left;
        }

        mark { background-color: #f0cf6a; color: #000; }
.opts li.correct-option { color: var(--correct-color); font-weight: 500; }
        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
    </style>

</head>

<script>

const allQuestions = [
 
  
 
  

  { n: 1, s: "Physiology", l: 1, q: "What is the primary effect of the Renin-Angiotensin-Aldosterone System (RAAS)?", o: ["A. Potassium and water retention", "B. Calcium excretion and vasoconstriction", "C. Sodium and water retention", "D. Magnesium retention and vasodilation", "E. Sodium excretion and potassium retention"], a: "C" },
  { n: 2, s: "Anatomy", l: 1, q: "Which blood vessel supplies the walls of larger blood vessels?", o: ["A. Vasa vasorum", "B. Tunica media", "C. Vasa nervorum", "D. Capillary bed", "E. Endothelial cleft"], a: "A" },
  { n: 3, s: "Physiology", l: 1, q: "What is the effect of doing regular aerobic exercise on the heart?", o: ["A. Increases resting heart rate", "B. Has no effect on resting heart rate", "C. Decreases stroke volume", "D. Increases cardiac systemic vascular resistance", "E. Decreases resting heart rate"], a: "E" },
  { n: 4, s: "Anatomy", l: 1, q: "Which artery is commonly used as the access point for CT angiography?", o: ["A. Femoral artery", "B. Radial artery", "C. Ulnar artery", "D. Brachial artery", "E. Popliteal artery"], a: "B" },
  { n: 5, s: "Physiology", l: 1, q: "In which condition is Candesartan strictly contraindicated?", o: ["A. Primary hypertension", "B. Congestive heart failure", "C. Diabetic nephropathy", "D. Bilateral renal stenosis", "E. Aortic regurgitation"], a: "D" },
  { n: 6, s: "Physiology", l: 1, q: "Which medication is indicated for the treatment of Raynaud's disease?", o: ["A. Nifedipine", "B. Aspirin", "C. Heparin", "D. Penicillin", "E. Metoprolol"], a: "A" },
  { n: 7, s: "Physiology", l: 1, q: "(case question) What is the drug of choice for a patient with the lipid profile (LDL 210, TG 130, HDL 45)?", o: ["A. Metformin", "B. Ezetimibe", "C. Atorvastatin", "D. Gemfibrozil", "E. Colesevelam"], a: "C" },
  { n: 8, s: "Physiology", l: 1, q: "What does the physiological term 'preload' refer to?", o: ["A. The resistance the ventricle must overcome to pump blood", "B. The volume of blood ejected during a single contraction", "C. The total volume of blood remaining in the atrium", "D. How much myocardium stretches at the end of diastole", "E. The velocity of blood flow through the aortic valve"], a: "D" },
  { n: 9, s: "Histology", l: 1, q: "Which of the following components is not contained within an atheroma?", o: ["A. Cholesterol crystals", "B. Basophil", "C. Foam cells", "D. Smooth muscle cells", "E. Necrotic core"], a: "B" },
  { n: 10, s: "Physiology", l: 1, q: "A wide QRS complex accompanied by tall, peaked T waves on an ECG indicates which of the following?", o: ["A. Mild hypokalemia", "B. Severe hypercalcemia", "C. Acute myocardial infarction", "D. Hypomagnesemia", "E. Severe hyperkalemia"], a: "E" },
  { n: 11, s: "Physiology", l: 1, q: "All of the following statements regarding peripheral vascular disease are correct EXCEPT:", o: ["A. Risk factors include smoking and diabetes", "B. Can lead to critical limb ischemia", "C. Intermittent claudication is pain during rest and gets better by walking", "D. Diagnosis can involve ankle-brachial index", "E. Physical signs include loss of hair on legs"], a: "C" },
  { n: 12, s: "Microbiology", l: 1, q: "Which of the following is a FALSE statement regarding Acute Rheumatic Fever (ARF)?", o: ["A. It is caused by staphylococcus pyogenes", "B. It follows a streptococcal pharyngitis", "C. Diagnostic criteria include Jones criteria", "D. It can lead to rheumatic heart disease", "E. Subcutaneous nodules are a major manifestation"], a: "A" },
  { n: 13, s: "Anatomy", l: 1, q: "Which vessels form the vascular anastomosis located posterior to the medial epicondyle?", o: ["A. Inferior ulnar collateral and anterior ulnar recurrent", "B. Profunda brachii and radial recurrent", "C. Superior ulnar collateral and anterior ulnar recurrent", "D. Superior ulnar collateral and posterior ulnar recurrent", "E. Radial collateral and interosseous recurrent"], a: "D" },
  { n: 14, s: "Anatomy", l: 1, q: "3rd posterior intercostal vein drains into:", o: ["A. Azygos vein", "B. Internal thoracic vein", "C. Hemiazygos vein", "D. Accessory hemiazygos vein", "E. Superior intercostal vein"], a: "E" },
  { n: 15, s: "Physiology", l: 1, q: "A 70-year-old woman suddenly loses consciousness while walking. The episode lasts about one minute. A witness reports no warning symptoms. What is the most likely cause?", o: ["A. Vasovagal syncope", "B. Cerebral hypoperfusion", "C. Hypoglycemia", "D. Orthostatic hypotension", "E. Anxiety attack"], a: "B" },
  { n: 16, s: "Anatomy", l: 1, q: "The union of the maxillary vein and the posterior auricular vein forms which of the following?", o: ["A. Retromandibular vein", "B. Internal jugular vein", "C. External jugular vein", "D. Facial vein", "E. Anterior jugular vein"], a: "A" },
  { n: 17, s: "Physiology", l: 1, q: "The closure of the atrioventricular valves occur at the:", o: ["A. Beginning of ventricular diastole", "B. End of ventricular systole", "C. Beginning of ventricular systole", "D. Middle of ventricular diastole", "E. End of atrial systole"], a: "C" },
  { n: 18, s: "Anatomy", l: 1, q: "All of the following are drained by the right lymphatic duct EXCEPT:", o: ["A. Right side of the head and neck", "B. Right lower limb", "C. Right upper limb", "D. Right side of the thorax", "E. Right bronchomediastinal trunk"], a: "B" },
  { n: 19, s: "Microbiology", l: 1, q: "Which of the following is NOT a risk factor for rheumatic heart disease?", o: ["A. HIV", "B. Immunosuppression", "C. IV drug use", "D. Asthma", "E. Overcrowding"], a: "D" },
  { n: 20, s: "Histology", l: 1, q: "Which pathological characteristic is typically found within the thrombus of Buerger's disease?", o: ["A. Huge non-inflammatory clots", "B. Large numbers of eosinophils", "C. Severe atheromatous plaque calcification", "D. Extensive foam cell accumulation", "E. Small micro abscesses"], a: "E" },
  { n: 21, s: "Microbiology", l: 1, q: "About chronic lymphatic filariasis, which of the following is correct?", o: ["A. Microfilaremia always elevated", "B. Microfilaremia often absent", "C. Microfilaremia easily detected during the day", "D. Diagnostic in 100% of cases", "E. Associated with acute bacterial cellulitis"], a: "B" },
  { n: 22, s: "Anatomy", l: 1, q: "Ischemia of the hindgut is most directly caused by the obstruction of which artery?", o: ["A. Celiac trunk", "B. Superior mesenteric artery", "C. Internal iliac artery", "D. Inferior mesenteric artery", "E. Common iliac artery"], a: "D" },
  { n: 23, s: "Microbiology", l: 1, q: "A patient presents with a sudden fever, and a culture shows gram-positive cocci normally found on the skin. What is the underlying pathophysiology?", o: ["A. Invasion by highly virulent bacteria (Staphylococcus aureus)", "B. Immune complex deposition", "C. Subacute colonization by low-virulence normal flora", "D. Hypersensitivity reaction", "E. Chronic granulomatous inflammation"], a: "A" },
  { n: 24, s: "Anatomy", l: 1, q: "All of the following are correct about chest X-ray findings, EXCEPT:", o: ["A. The right hemidiaphragm is normally higher than the left", "B. The cardiac silhouette occupies less than 50% of the thoracic width", "C. Pulmonary window is located between the aortic arch and right pulmonary artery", "D. Costophrenic angles should be sharp and clear", "E. The trachea is typically midline or slightly to the right"], a: "C" },
  { n: 25, s: "Physiology", l: 1, q: "A patient presents with bilateral pitting edema of the lower limbs and hepatomegaly. What is the diagnosis?", o: ["A. Left-sided heart failure", "B. Nephrotic syndrome", "C. Cirrhosis of the liver", "D. Deep vein thrombosis", "E. Right-sided heart failure"], a: "E" },
  { n: 26, s: "Community Medicine", l: 1, q: "Which statement about coronary heart disease is FALSE?", o: ["A. Smoking cessation reduces recurrent MI risk ~50%", "B. Hypertension is a risk factor", "C. Smoking cessation is a therapy", "D. Smoking acts additively with other risk factors", "E. High alcohol intake is an independent risk factor"], a: "D" },
  { n: 27, s: "Physiology", l: 1, q: "All of the following indications or associations for performing an ECG are correct EXCEPT:", o: ["A. All patients over 60 years old", "B. All patients under 10 years old", "C. Diabetics", "D. Cardiothoracic surgery", "E. Cardiovascular and renal diseases"], a: "B" },


  
 

  { 
    n: 28, 
    s: "Essay Questions", 
    l: 1, 
    q: "A patient develops chest pain after 5 minutes of climbing stairs, which is relieved by rest. Explain the pathophysiology. (stable angina case)", 
    o: [""], 
    a: "Myocardial ischemia during exertion alters ventricular repolarization, leading to ST-segment depression."
  },
  
  

 { 
    n: 29, 
    s: "Essay Questions", 
    l: 1, 
     o: [""], 
    q: "Why should phosphodiesterase-5 inhibitors not be used with nitrates?",
    a: "Because both increase nitric oxide–mediated cGMP, causing excessive vasodilation and severe hypotension"
},






];


const lectures = {
   1:  "Blood vessels of the thorax",
   2:  "Blood vessels of the head and neck",
   
};
  
const lectureFilters = {
    "All": [],
    "Anatomy": [
        { label: "All",                            val: "All" },
        
        { label: "Blood vessels of the thorax",     val: 1 },
        { label: "Blood vessels of the head and neck",     val: 2 },
      

 ],

 


};
let currentSubjectFilter = "All";  // default
let currentLecture = "All";

const container = document.getElementById('quiz-content');
const filterBar = document.getElementById('filter-bar');

function renderFilterBar() {
    const filters = lectureFilters[currentSubjectFilter] || lectureFilters["All"];
    filterBar.innerHTML = filters.map(f =>
        `<button class="filter-btn${f.val === currentLecture ? " active" : ""}" onclick="filterByLecture('${f.val}', this)">${f.label}</button>`
    ).join('');
}

function getLectureLabel(val) {
    if (val === "All" && currentSubjectFilter === "All") return "All";
    if (val === "All") {
        const subjectLabels = {
    "Anatomy": "Anatomy 🦴",
    "Physiology": "Physiology ⚡",
    "Microbiology": "Microbiology 🦠",
    "Pharmacology": "Pharmacology 💊",
    "Biochemistry": "Biochemistry 🧪",
    "Pathology": "Pathology 🔬",
    "Genetics": "Genetics 🧬",
    "Medical Education": "Medical Education 📘",
    "Histology": "Histology 🫁",
    "Community Medicine": "Community Medicine 📕",
    "Radiology": "Radiology ☢️"
};
 return subjectLabels[currentSubjectFilter] || currentSubjectFilter;
    }
    return lectures[val] || val;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = "No questions found.";
            container.appendChild(noResultsMsg);
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentLecture);
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;

    if (existing) {
        existing.style.display = (count === 0) ? "none" : "flex";
        existing.querySelector('.section-heading-title').textContent = label;
        existing.querySelector('.mcq-count-badge').textContent = badgeText;
    } else if (count > 0) {
        const heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = `<span class="section-heading-title">${label}</span><span class="mcq-count-badge">${badgeText}</span>`;
        container.insertBefore(heading, container.firstChild);
    }
}

function renderQuiz() {
    container.innerHTML = '';
    allQuestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.subject = item.s;
        div.dataset.lecture = item.l ?? "";
        div.dataset.searchText = (item.q + " " + item.o.join(" ")).toLowerCase();

        div.style.display = matchesFilters(item) ? "block" : "none";

        // If item.a is an array, render one button per element (Answer A, Answer B, ...).
        // If item.a is a plain string, render the normal single "Answer" button.
        // This is purely structural -- no need for "A."/"B." text in the answer itself.
        const isMulti = Array.isArray(item.a);
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

        // Essay questions have no real options (o is empty or just [""]).
        // For those, show just the answer text -- no "Answer:" prefix.
        const isEssay = !item.o || item.o.length === 0 || (item.o.length === 1 && item.o[0].trim() === "");

        const answerButtonsHtml = isMulti
            ? item.a.map((part, i) => {
                const label = `Answer ${letters[i] || (i + 1)}`;
                const revealText = isEssay ? part : `Answer: ${part}`;
                return `<button class="ans-btn" data-label="${label}" data-answer="${escapeAttr(revealText)}" data-essay="${isEssay}" data-correct="${escapeAttr(part)}" onclick="toggleAnswer(this)">${label}</button>`;
              }).join('')
            : `<button class="ans-btn" data-label="Answer" data-answer="${escapeAttr(isEssay ? item.a : 'Answer: ' + item.a)}" data-essay="${isEssay}" data-correct="${escapeAttr(item.a)}" onclick="toggleAnswer(this)">Answer</button>`;

        div.innerHTML = `
            <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            <div class="ans-row${isMulti ? ' ans-row--multi' : ''}">
                ${answerButtonsHtml}
            </div>
        `;
        container.appendChild(div);
    });
    updateSectionHeading();
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
    }
});

function matchesFilters(item) {
    const subjectOk = currentSubjectFilter === "All" || item.s === currentSubjectFilter;
    const lectureOk = currentLecture === "All" || item.l === currentLecture;
    return subjectOk && lectureOk;
}

function filterByLecture(val, btn) {
    currentLecture = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    handleSearch();
}

// Subject dropdown logic
function toggleSubjectDropdown() {
    const dd = document.getElementById('subject-dropdown');
    const btn = document.getElementById('subject-toggle-btn');
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
        dd.classList.remove('open');
        btn.classList.remove('dropdown-open');
    } else {
        dd.classList.add('open');
        btn.classList.add('dropdown-open');
    }
}

function selectSubjectFilter(subject, el) {
    currentSubjectFilter = subject;
    currentLecture = "All";
    localStorage.setItem('selectedSubject', subject);
    // update selected state in dropdown
    document.querySelectorAll('.subject-dropdown-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    // keep dropdown open — do NOT close it
    // re-render filter bar and quiz
    renderFilterBar();
    handleSearch();
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.subject-toggle-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('subject-dropdown').classList.remove('open');
        document.getElementById('subject-toggle-btn').classList.remove('dropdown-open');
    }
});

function toggleSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    const isOpen = bar.classList.contains('open');
    if (isOpen) {
        closeSearchBar();
    } else {
        bar.classList.add('open');
        document.getElementById('search-input').focus();
    }
}

function closeSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    bar.classList.remove('open');
    const input = document.getElementById('search-input');
    input.value = '';
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');
    blocks.forEach(block => {
        resetBlock(block);
        const subjectOk = currentSubjectFilter === "All" || block.dataset.subject === currentSubjectFilter;
        const lectureOk = currentLecture === "All" || String(block.dataset.lecture) === String(currentLecture);
        const matchesSearch = term === "" || block.dataset.searchText.includes(term);
        if (subjectOk && lectureOk && matchesSearch) {
            block.style.display = "block";
            if (term !== "") highlight(block, term);
        } else {
            block.style.display = "none";
        }
    });
    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => { li.innerHTML = li.dataset.original; li.classList.remove('correct-option'); });
    block.querySelectorAll('.ans-btn').forEach(btn => {
        btn.classList.remove('revealed');
        btn.dataset.revealed = "false";
        if (btn.dataset.answer) btn.textContent = btn.dataset.label;
    });
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function toggleAnswer(btn) {
    // Essay questions have no real options to highlight, so keep the original
    // behavior of revealing the answer text directly on the button.
    if (btn.dataset.essay === "true") {
        const isRevealed = btn.classList.toggle('revealed');
        btn.textContent = isRevealed ? btn.dataset.answer : btn.dataset.label;
        return;
    }

    // MCQ questions: keep all options the same color, and instead of showing
    // the answer on the button, color the correct option(s) red and turn the
    // button into a "Hide" button. The button's own appearance should not
    // change, only its text, so we track state via a data attribute rather
    // than the styled 'revealed' class.
    const isRevealed = btn.dataset.revealed !== "true";
    btn.dataset.revealed = isRevealed ? "true" : "false";
    const block = btn.closest('.q-block');
    const correctLetters = (btn.dataset.correct || '')
        .split(/[,\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

    block.querySelectorAll('.opts li').forEach(li => {
        const original = li.dataset.original || li.textContent;
        const letter = original.split('.')[0].trim();
        if (correctLetters.includes(letter)) {
            li.classList.toggle('correct-option', isRevealed);
        }
    });

    btn.textContent = isRevealed ? btn.dataset.label.replace('Answer', 'Hide') : btn.dataset.label;
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    // Restore saved subject (default: Biochemistry)
    const saved = localStorage.getItem('selectedSubject');
    if (saved && lectureFilters[saved]) {
        currentSubjectFilter = saved;
    }
    // Mark the correct dropdown item as selected
    document.querySelectorAll('.subject-dropdown-item').forEach(item => {
        if (item.dataset.subject === currentSubjectFilter) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
}());

renderFilterBar();
renderQuiz();
</script>
</body>
</html>
