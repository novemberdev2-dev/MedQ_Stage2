<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP_Final_2021-2022</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #f1f5f9;
            --header-text: #0f172a;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --correct-color: #2e7d32;
            --btn-bg: #f8fafc; 
            --btn-text: #0f172a;
            
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #fcfcfc;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --correct-color: #e53935;
            --btn-bg: #52525b; 
            --btn-text: #ffffff;
            
        }

      .filter-btn.active {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        body {
            -webkit-user-select: none;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px;
           min-height: 28px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .header {
                align-items: flex-start;
                text-align: left;
            }
            .header-title-wrap {
                align-items: flex-start;
            }
            .header-title {
                font-size: 0.80rem;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                line-height: 1.4;
                text-align: left;
            }
            .title-line1,
            .title-line2 {
                display: block;
            }
            .title-sep-2 {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .icon-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 10px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            border-radius: 7px;
        }

        .search-wrapper .search-icon-svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            padding: 10px 10px 10px 40px;
            font-size: 1.1rem;
            border: none;
            background-color: transparent;
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .search-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .theme-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-toggle-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .search-bar-expand {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-bar-expand.open {
            display: flex;
        }

        .search-close-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .filter-container {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            max-width: 100%;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        /* Subject picker dropdown */
        .subject-toggle-wrapper {
            position: relative;
            display: inline-block;
        }

        .subject-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .subject-toggle svg {
            stroke: none !important;
            fill: var(--text-main);
            pointer-events: none;
        }

        .subject-toggle.dropdown-open {
            border-color: rgba(255,255,255,0.3);
            background: rgba(40, 42, 45, 0.9);
        }

        .subject-toggle.dropdown-open svg { fill: var(--text-main); }

        [data-theme="light"] .subject-toggle.dropdown-open {
            border-color: #121212;
            background: rgba(255,255,255,1);
        }

        .subject-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            min-width: 210px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        .subject-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        [data-theme="light"] .subject-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .subject-dropdown-header {
            padding: 14px 16px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        [data-theme="light"] .subject-dropdown-header {
            border-bottom-color: rgba(0,0,0,0.08);
            color: #999;
        }

        .subject-dropdown-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
        }

        [data-theme="light"] .subject-dropdown-item { color: #666; }

        .subject-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .subject-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .subject-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .subject-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .subject-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .subject-dropdown-item.selected { color: #111; }

        .filter-option-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .filter-option-dot { border-color: rgba(0,0,0,0.2); }

        .subject-dropdown-item.selected .filter-option-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .subject-dropdown-item.selected .filter-option-dot {
            background: #111;
            border-color: #111;
        }

        .controls-row { position: relative; }

        .filter-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
            margin-bottom: 10px;
            margin-top: 6px;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .q-block:last-child { border-bottom: none; }
        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ans-row--multi {
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
        }
.ans-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 7px 20px;
            border-radius: 5px; 
            margin-top: 20px;
            font-weight: 650;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
        }


        .ans-btn:hover {
            opacity: 0.9;
        }
        .ans-btn:active {
            transform: scale(0.98);
        }

        .ans-btn.revealed {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            padding: 7px 12px;
            font-size: 16px;
            white-space: pre-line;
            text-align: left;
        }

        mark { background-color: #f0cf6a; color: #000; }
.opts li.correct-option { color: var(--correct-color); font-weight: 500; }
        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
    </style>

</head>

    <div class="filter-container" id="filter-bar"></div>

    <hr class="divider">
    <div id="quiz-content"></div>
</div>

<script>

const allQuestions = [
 
  

{ n: 1, s: "Pharmacology", l: 1, q: "A patient on warfarin therapy presents with severe bleeding. Which of the following should be administered immediately as a specific antidote?", o: ["A. Protamine sulfate", "B. Aminocaproic acid", "C. Idarucizumab", "D. Andexanet alfa", "E. Vitamin K injection"], a: "E" },
{ n: 2, s: "Pharmacology", l: 1, q: "A patient is transitioned from heparin to warfarin. After one week of continuous warfarin therapy and stopping heparin, which parameter do doctors need to monitor exclusively?", o: ["A. Activated partial thromboplastin time (aPTT) only", "B. Prothrombin time (PT) / INR only", "C. Bleeding time", "D. Both aPTT and PT", "E. Platelet count"], a: "B" },
{ n: 3, s: "Pharmacology", l: 1, q: "Why is low-molecular-weight heparin (LMWH) preferred in many patients?", o: ["A. Associated with a higher risk of HIT", "B. Administered via continuous intravenous infusion only", "C. Useful or easier to manage in outpatients", "D. Monitored daily using the aPTT assay", "E. Reversible completely with vitamin K"], a: "C" },
{ n: 4, s: "Pharmacology", l: 1, q: "Which of the following medications should NOT be used in a patient suffering from an acute flare of gout?", o: ["A. Aspirin", "B. Ibuprofen", "C. Naproxen", "D. Indomethacin", "E. Acetaminophen"], a: "A" },
{ n: 5, s: "Pharmacology", l: 1, q: "Epoetin alfa is not indicated for the treatment of anemia caused by which of the following conditions?", o: ["A. Iron deficiency anemia", "B. Anemia due to chronic kidney disease", "C. Chemotherapy-induced anemia", "D. Hemolytic anemia", "E. Zidovudine-induced anemia"], a: "D" },
{ n: 6, s: "Pharmacology", l: 1, q: "Aminocaproic acid is primarily used as which of the following types of drugs?", o: ["A. Anticoagulant", "B. Antiplatelet agent", "C. Thrombolytic agent", "D. Antithrombolytic", "E. Vitamin K antagonist"], a: "D" },

{ n: 7, s: "Histology", l: 1, q: "Which type of bone marrow is characterized by the presence of numerous fat cells and serves mainly as a storage site for adipose tissue?", o: ["A. Red bone marrow", "B. Spongy bone marrow", "C. Compact bone marrow", "D. Hematopoietic marrow", "E. Yellow bone marrow"], a: "E" },
{ n: 8, s: "Histology", l: 1, q: "Reticular epithelial cells play a critical role in the structural support and T-cell maturation within which organ?", o: ["A. Spleen", "B. Thymus", "C. Lymph node", "D. Thyroid gland", "E. Bone marrow"], a: "B" },

{ n: 9, s: "Biochemistry", l: 1, q: "Which of the following statements is TRUE regarding the pentose phosphate pathway?", o: ["A. It produces carbon dioxide during the oxidative phase", "B. It is the main pathway for ATP production in cells", "C. It occurs only in skeletal muscle cells", "D. It converts glucose directly into pyruvate", "E. It does not generate any reducing equivalents"], a: "A" },

{ n: 10, s: "Pathology", l: 1, q: "Polycythemia vera is a myeloproliferative neoplasm characteristically associated with which molecular abnormality?", o: ["A. BCR-ABL translocation", "B. JAK2 mutation", "C. BRAF V600E mutation", "D. MYC amplification", "E. TP53 deletion"], a: "B" },
{ n: 11, s: "Pathology", l: 1, q: "Regarding iron deficiency anemia (IDA), which of the following morphologic descriptions is WRONG?", o: ["A. Microcytic red blood cells", "B. Hypochromic red blood cells", "C. Macrocytic red blood cells", "D. Anisocytosis", "E. Poikilocytosis"], a: "C" },
{ n: 12, s: "Pathology", l: 1, q: "Which of the following organs is NOT a normal site of hemopoiesis during human development?", o: ["A. Bone marrow", "B. Liver", "C. Spleen", "D. Yolk sac", "E. Kidney"], a: "E" },
{ n: 13, s: "Pathology", l: 1, q: "A patient presenting with symptoms highly suggestive of hemophilia should undergo which laboratory workup? (case question)", o: ["A. Bleeding time + Factor VII assay", "B. Prothrombin time (PT) + Factor X assay", "C. Thrombin time + D-dimer test", "D. Activated partial thromboplastin time (aPTT) + Factor VIII & IX assays", "E. Platelet aggregation studies"], a: "D" },
{ n: 14, s: "Pathology", l: 1, q: "An adolescent male presents with severe epistaxis and a highly vascular mass located at the posterior nasal wall. What is the most likely diagnosis? (matching question)", o: ["A. Sinonasal papilloma", "B. Juvenile nasopharyngeal angiofibroma", "C. Squamous cell carcinoma", "D. Nasopharyngeal carcinoma", "E. Esthesioneuroblastoma"], a: "B" },
{ n: 15, s: "Pathology", l: 1, q: "Chronic lymphocytic leukemia (CLL) is best defined as a neoplastic proliferation of which cells? (matching question)", o: ["A. Immature blast cells only", "B. Multipotent hematopoietic stem cells", "C. Plasmacytoid monocytes", "D. Granulocytes and their precursors", "E. Mature and maturing neoplastic lymphocytes"], a: "E" },
{ n: 16, s: "Pathology", l: 1, q: "Acute promyelocytic leukemia (APL), a subtype of AML, is characteristically associated with which chromosomal translocation?", o: ["A. t(9;22)", "B. t(8;14)", "C. t(15;17)", "D. t(11;14)", "E. t(12;21)"], a: "C" },
{ n: 17, s: "Pathology", l: 1, q: "To confirm a diagnosis of acute leukemia in a bone marrow aspirate, the proportion of lymphoblasts or myeloblasts must exceed what threshold?", o: ["A. > 5%", "B. > 10%", "C. > 20%", "D. > 50%", "E. > 80%"], a: "C" },
{ n: 18, s: "Pathology", l: 1, q: "Which of the following conditions is NOT associated with the development of polycythemia?", o: ["A. Chronic hypoxia due to lung disease", "B. High altitude exposure", "C. Polycythemia vera", "D. Acute myeloid leukemia (AML)", "E. Renal tumors producing erythropoietin"], a: "D" },
{ n: 19, s: "Pathology", l: 1, q: "A child presents with low MCH, low MCV, decreased hemoglobin, and elevated hemoglobin A2 levels. What is the diagnosis?", o: ["A. Iron deficiency anemia", "B. Beta-thalassemia carrier (heterozygous)", "C. Alpha-thalassemia trait", "D. Sickle cell trait", "E. Aplastic anemia"], a: "B" },
{ n: 20, s: "Pathology", l: 1, q: "The Philadelphia chromosome results from a translocation between chromosomes 9 and 22, producing which of the following gene fusions?", o: ["A. BCR-ABL fusion gene", "B. MYC-BCL2 fusion gene", "C. PML-RARA fusion gene", "D. EWS-FLI1 fusion gene", "E. JAK2-STAT5 fusion gene"], a: "A" },
{ n: 21, s: "Pathology", l: 1, q: "Which of the following conditions is NOT a recognized cause of iron deficiency anemia (IDA)?", o: ["A. Chronic gastrointestinal bleeding", "B. Poor dietary intake", "C. Hookworm infestation", "D. Hepatic cell carcinoma", "E. Pregnancy"], a: "D" },
{ n: 22, s: "Pathology", l: 1, q: "A patient has a prolonged prothrombin time (PT) with normal platelet count and bleeding time. Deficiency of which coagulation factor is the most likely cause?", o: ["A. Factor VIII deficiency", "B. Factor IX deficiency", "C. Factor VII deficiency", "D. Factor XII deficiency", "E. Fibrinogen deficiency"], a: "C" },
{ n: 23, s: "Pathology", l: 1, q: "A patient with heterozygous β-thalassemia (β-thalassemia trait) shows which characteristic finding on hemoglobin analysis?", o: ["A. Decreased HbA2 level", "B. Complete absence of β-globin chains", "C. Absence of HbF", "D. Increased HbS production", "E. Increased HbA2 level"], a: "E" },

{ n: 24, s: "Physiology", l: 1, q: "Rho(D) immune globulin (RhoGAM) prevents hemolytic disease of the newborn by targeting which type of antigen?", o: ["A. Visible ABO antigens on maternal red cells", "B. Invisible RhD antigens on fetal red cells", "C. Platelet surface antigens", "D. White blood cell antigens", "E. Complement proteins in maternal plasma"], a: "B" },
{ n: 25, s: "Physiology", l: 1, q: "The clumping of particulate antigens when mixed with their specific corresponding antibodies is termed:", o: ["A. Agglutination", "B. Precipitation", "C. Opsonization", "D. Lysis", "E. Neutralization"], a: "A" },
{ n: 26, s: "Physiology", l: 1, q: "Regarding the physiological functions of erythrocytes, which statement is WRONG?", o: ["A. Transport of oxygen from lungs to tissues", "B. Buffering of hydrogen ions via hemoglobin", "C. Transport of carbon dioxide as bicarbonate", "D. It is needed for bile salt synthesis", "E. Maintaining blood viscosity"], a: "D" },
{ n: 27, s: "Physiology", l: 1, q: "Which class of endothelial adhesion receptors mediates the initial rolling phase of leukocyte extravasation?", o: ["A. Integrins", "B. Selectins", "C. Cadherins", "D. Immunoglobulin superfamily (ICAM)", "E. Claudins"], a: "B" },
{ n: 28, s: "Physiology", l: 1, q: "Which of the following statements regarding albumin is WRONG?", o: ["A. It is the major plasma protein", "B. It contributes significantly to plasma oncotic pressure", "C. It is synthesized by the liver", "D. It is freely filtered through the glomeruli of the kidneys", "E. It serves as a carrier protein for many endogenous and exogenous substances"], a: "D" },

{ n: 29, s: "Microbiology", l: 1, q: "Which of the following diseases can cause gastroenteritis in children?", o: ["A. Paratyphoid fever", "B. Tetanus", "C. Diphtheria", "D. Tuberculosis", "E. Syphilis"], a: "A" },
{ n: 30, s: "Microbiology", l: 1, q: "Which of the following is a zoonotic infectious disease transmitted from animals to humans?", o: ["A. Brucellosis", "B. Cholera", "C. Shigellosis", "D. Diphtheria", "E. Gonorrhea"], a: "A" },
{ n: 31, s: "Microbiology", l: 1, q: "Undulant (intermittent) fever is a characteristic clinical feature of infection caused by which of the following organisms?", o: ["A. Vibrio cholerae", "B. Salmonella Typhi", "C. Brucella melitensis", "D. Shigella dysenteriae", "E. Corynebacterium diphtheriae"], a: "C" },

{ n: 32, s: "Medicine", l: 1, q: "Which of the following laboratory findings is NOT characteristic of iron deficiency anemia?", o: ["A. Low serum ferritin", "B. Increased total iron-binding capacity (TIBC)", "C. Microcytic hypochromic red blood cells", "D. Decreased transferrin saturation", "E. Hyperferremia (increased serum iron)"], a: "E" },
{ n: 33, s: "Medicine", l: 1, q: "Which of the following statements regarding smoking is correct?", o: ["A. It increases the risk of chronic obstructive pulmonary disease (COPD)", "B. It is not a cause of chronic bronchitis", "C. It can lead to secondary polycythemia", "D. It does not typically cause pallor", "E. It increases the risk of cardiovascular disease"], a: "D" },





];


const lectures = {
   1:  "Haemopoiesis",
   2:  "Megaloblastic Anemia",
   
};
  
const lectureFilters = {
    "All": [],
    "Pathology": [
        { label: "All",                            val: "All" },
        
        { label: "Haemopoiesis",     val: 1 },
        { label: "Megaloblastic Anemia",     val: 2 },
      

 ],

 


};
let currentSubjectFilter = "All";  // default
let currentLecture = "All";

const container = document.getElementById('quiz-content');
const filterBar = document.getElementById('filter-bar');

function renderFilterBar() {
    const filters = lectureFilters[currentSubjectFilter] || lectureFilters["All"];
    filterBar.innerHTML = filters.map(f =>
        `<button class="filter-btn${f.val === currentLecture ? " active" : ""}" onclick="filterByLecture('${f.val}', this)">${f.label}</button>`
    ).join('');
}

function getLectureLabel(val) {
    if (val === "All" && currentSubjectFilter === "All") return "All";
    if (val === "All") {
         const subjectLabels = {
    "Physiology": "Physiology ⚡",
    "Microbiology": "Microbiology 🦠",
    "Pharmacology": "Pharmacology 💊",
    "Biochemistry": "Biochemistry 🧪",
    "Pathology": "Pathology 🔬",
    "Medicine": "Medicine📘",
    "Histology": "Histology 🫁",
};
 return subjectLabels[currentSubjectFilter] || currentSubjectFilter;
    }
    return lectures[val] || val;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = "No questions found.";
            container.appendChild(noResultsMsg);
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentLecture);
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;

    if (existing) {
        existing.style.display = (count === 0) ? "none" : "flex";
        existing.querySelector('.section-heading-title').textContent = label;
        existing.querySelector('.mcq-count-badge').textContent = badgeText;
    } else if (count > 0) {
        const heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = `<span class="section-heading-title">${label}</span><span class="mcq-count-badge">${badgeText}</span>`;
        container.insertBefore(heading, container.firstChild);
    }
}

function renderQuiz() {
    container.innerHTML = '';
    allQuestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.subject = item.s;
        div.dataset.lecture = item.l ?? "";
        div.dataset.searchText = (item.q + " " + item.o.join(" ")).toLowerCase();

        div.style.display = matchesFilters(item) ? "block" : "none";

        // If item.a is an array, render one button per element (Answer A, Answer B, ...).
        // If item.a is a plain string, render the normal single "Answer" button.
        // This is purely structural -- no need for "A."/"B." text in the answer itself.
        const isMulti = Array.isArray(item.a);
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

        // Essay questions have no real options (o is empty or just [""]).
        // For those, show just the answer text -- no "Answer:" prefix.
        const isEssay = !item.o || item.o.length === 0 || (item.o.length === 1 && item.o[0].trim() === "");

        const answerButtonsHtml = isMulti
            ? item.a.map((part, i) => {
                const label = `Answer ${letters[i] || (i + 1)}`;
                const revealText = isEssay ? part : `Answer: ${part}`;
                return `<button class="ans-btn" data-label="${label}" data-answer="${escapeAttr(revealText)}" data-essay="${isEssay}" data-correct="${escapeAttr(part)}" onclick="toggleAnswer(this)">${label}</button>`;
              }).join('')
            : `<button class="ans-btn" data-label="Answer" data-answer="${escapeAttr(isEssay ? item.a : 'Answer: ' + item.a)}" data-essay="${isEssay}" data-correct="${escapeAttr(item.a)}" onclick="toggleAnswer(this)">Answer</button>`;

        div.innerHTML = `
            <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            <div class="ans-row${isMulti ? ' ans-row--multi' : ''}">
                ${answerButtonsHtml}
            </div>
        `;
        container.appendChild(div);
    });
    updateSectionHeading();
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
    }
});

function matchesFilters(item) {
    const subjectOk = currentSubjectFilter === "All" || item.s === currentSubjectFilter;
    const lectureOk = currentLecture === "All" || item.l === currentLecture;
    return subjectOk && lectureOk;
}

function filterByLecture(val, btn) {
    currentLecture = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    handleSearch();
}

// Subject dropdown logic
function toggleSubjectDropdown() {
    const dd = document.getElementById('subject-dropdown');
    const btn = document.getElementById('subject-toggle-btn');
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
        dd.classList.remove('open');
        btn.classList.remove('dropdown-open');
    } else {
        dd.classList.add('open');
        btn.classList.add('dropdown-open');
    }
}

function selectSubjectFilter(subject, el) {
    currentSubjectFilter = subject;
    currentLecture = "All";
    localStorage.setItem('selectedSubject', subject);
    // update selected state in dropdown
    document.querySelectorAll('.subject-dropdown-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    // keep dropdown open — do NOT close it
    // re-render filter bar and quiz
    renderFilterBar();
    handleSearch();
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.subject-toggle-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('subject-dropdown').classList.remove('open');
        document.getElementById('subject-toggle-btn').classList.remove('dropdown-open');
    }
});

function toggleSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    const isOpen = bar.classList.contains('open');
    if (isOpen) {
        closeSearchBar();
    } else {
        bar.classList.add('open');
        document.getElementById('search-input').focus();
    }
}

function closeSearchBar() {
    const bar = document.getElementById('search-bar-expand');
    bar.classList.remove('open');
    const input = document.getElementById('search-input');
    input.value = '';
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');
    blocks.forEach(block => {
        resetBlock(block);
        const subjectOk = currentSubjectFilter === "All" || block.dataset.subject === currentSubjectFilter;
        const lectureOk = currentLecture === "All" || String(block.dataset.lecture) === String(currentLecture);
        const matchesSearch = term === "" || block.dataset.searchText.includes(term);
        if (subjectOk && lectureOk && matchesSearch) {
            block.style.display = "block";
            if (term !== "") highlight(block, term);
        } else {
            block.style.display = "none";
        }
    });
    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => { li.innerHTML = li.dataset.original; li.classList.remove('correct-option'); });
    block.querySelectorAll('.ans-btn').forEach(btn => {
        btn.classList.remove('revealed');
        btn.dataset.revealed = "false";
        if (btn.dataset.answer) btn.textContent = btn.dataset.label;
    });
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function toggleAnswer(btn) {
    // Essay questions have no real options to highlight, so keep the original
    // behavior of revealing the answer text directly on the button.
    if (btn.dataset.essay === "true") {
        const isRevealed = btn.classList.toggle('revealed');
        btn.textContent = isRevealed ? btn.dataset.answer : btn.dataset.label;
        return;
    }

    // MCQ questions: keep all options the same color, and instead of showing
    // the answer on the button, color the correct option(s) red and turn the
    // button into a "Hide" button. The button's own appearance should not
    // change, only its text, so we track state via a data attribute rather
    // than the styled 'revealed' class.
    const isRevealed = btn.dataset.revealed !== "true";
    btn.dataset.revealed = isRevealed ? "true" : "false";
    const block = btn.closest('.q-block');
    const correctLetters = (btn.dataset.correct || '')
        .split(/[,\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

    block.querySelectorAll('.opts li').forEach(li => {
        const original = li.dataset.original || li.textContent;
        const letter = original.split('.')[0].trim();
        if (correctLetters.includes(letter)) {
            li.classList.toggle('correct-option', isRevealed);
        }
    });

    btn.textContent = isRevealed ? btn.dataset.label.replace('Answer', 'Hide') : btn.dataset.label;
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    // Restore saved subject (default: Biochemistry)
    const saved = localStorage.getItem('selectedSubject');
    if (saved && lectureFilters[saved]) {
        currentSubjectFilter = saved;
    }
    // Mark the correct dropdown item as selected
    document.querySelectorAll('.subject-dropdown-item').forEach(item => {
        if (item.dataset.subject === currentSubjectFilter) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
}());

renderFilterBar();
renderQuiz();
</script>
</body>
</html>
