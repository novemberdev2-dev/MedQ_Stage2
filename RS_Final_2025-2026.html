<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS_Final_2025-2026</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #f1f5f9;
            --header-text: #0f172a;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --correct-color: #2e7d32;
            --btn-bg: #f8fafc; 
            --btn-text: #0f172a;
            
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #fcfcfc;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --correct-color: #e53935;
            --btn-bg: #52525b; 
            --btn-text: #ffffff;
            
        }

      .filter-btn.active {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        body {
            -webkit-user-select: none;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 12px;
            min-height: 28px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .header {
                align-items: center;
            }
            .header-title-wrap {
                align-items: center;
            }
            .header-title {
                font-size: 0.80rem;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                line-height: 1.4;
                text-align: left;
            }
            .title-line1,
            .title-line2 {
                display: block;
            }
            .title-sep-2 {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .icon-divider {
            width: 1px;
            height: 24px;
            background-color: var(--input-border);
            flex-shrink: 0;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 10px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            width: 100%;
            padding: 8px 10px 8px 40px;
            font-size: 1rem;
            border: none;
            background-color: transparent;
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .theme-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            cursor: pointer;
        }

        .search-toggle-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* Takeover styles */
        .search-takeover-wrap {
            display: none;
            width: 100%;
            align-items: center;
        }

        .search-takeover-wrap.open {
            display: flex;
        }

        .search-close-btn {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            cursor: pointer;
        }

        .filter-container {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            max-width: 100%;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        /* Subject picker dropdown */
        .subject-toggle-wrapper {
            position: relative;
            display: inline-block;
        }

        .subject-toggle {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            cursor: pointer;
        }

        .subject-toggle svg {
            stroke: none !important;
            fill: var(--text-main);
            pointer-events: none;
        }

        .subject-toggle.dropdown-open {
            border-color: rgba(255,255,255,0.3);
            background: rgba(40, 42, 45, 0.9);
        }

        .subject-toggle.dropdown-open svg { fill: var(--text-main); }

        [data-theme="light"] .subject-toggle.dropdown-open {
            border-color: #121212;
            background: rgba(255,255,255,1);
        }

        .subject-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            overflow: hidden;
            min-width: 210px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.97);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 16px 48px rgba(0,0,0,0.65);
        }

        .subject-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        [data-theme="light"] .subject-dropdown {
            background: #ffffff;
            border-color: rgba(0,0,0,0.13);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .subject-dropdown-header {
            padding: 14px 16px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        [data-theme="light"] .subject-dropdown-header {
            border-bottom-color: rgba(0,0,0,0.08);
            color: #999;
        }

        .subject-dropdown-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 13px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #aaa;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
        }

        [data-theme="light"] .subject-dropdown-item { color: #666; }

        .subject-dropdown-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        [data-theme="light"] .subject-dropdown-item:not(:last-child) {
            border-bottom-color: rgba(0,0,0,0.06);
        }

        .subject-dropdown-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        [data-theme="light"] .subject-dropdown-item:hover {
            background: rgba(0,0,0,0.04);
            color: #111;
        }

        .subject-dropdown-item.selected { color: #f1f5f9; }

        [data-theme="light"] .subject-dropdown-item.selected { color: #111; }

        .filter-option-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        [data-theme="light"] .filter-option-dot { border-color: rgba(0,0,0,0.2); }

        .subject-dropdown-item.selected .filter-option-dot {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        [data-theme="light"] .subject-dropdown-item.selected .filter-option-dot {
            background: #111;
            border-color: #111;
        }

        .controls-row { position: relative; }

        .filter-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
            margin-bottom: 10px;
            margin-top: 6px;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .q-block:last-child { border-bottom: none; }
        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ans-row--multi {
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
        }
        .ans-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 7px 20px;
            border-radius: 5px; 
            margin-top: 20px;
            font-weight: 650;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
        }

        .ans-btn:hover {
            opacity: 0.9;
        }
        .ans-btn:active {
            transform: scale(0.98);
        }

        .ans-btn.revealed {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            padding: 7px 12px;
            font-size: 16px;
            white-space: pre-line;
            text-align: left;
        }

        mark { background-color: #f0cf6a; color: #000; }
        .opts li.correct-option { color: var(--correct-color); font-weight: 500; }
        
        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Eye / Copy / Pin icon buttons */
        .ans-row {
            justify-content: flex-start !important;
        }

        .icon-btn, .eye-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            transition: background-color 0.2s ease, opacity 0.2s ease, color 0.2s ease;
            margin-top: 20px;
        }

        .icon-btn:hover, .eye-btn:hover {
            background-color: rgba(255,255,255,0.08);
        }

        [data-theme="light"] .icon-btn:hover,
        [data-theme="light"] .eye-btn:hover {
            background-color: rgba(0,0,0,0.06);
        }

        .icon-btn svg, .eye-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            fill: currentColor;
        }

        .eye-btn svg.icon-eye-open {
            width: 22px;
            height: 22px;
        }

        .eye-btn[data-revealed="true"] {
            color: var(--correct-color);
        }

        .pin-btn[data-pinned="true"] {
            color: var(--correct-color);
        }

        .eye-part-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eye-part-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-opts);
            opacity: 0.7;
            min-width: 12px;
            text-align: center;
        }

        .answer-text {
            display: none;
            width: 100%;
            box-sizing: border-box;
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            font-size: 15px;
            padding: 7px 12px;
            border-radius: 5px;
            white-space: pre-line;
            text-align: left;
            margin-top: 10px;
        }

        .copy-wrap {
            position: relative;
            display: inline-flex;
        }

        .copied-tooltip {
            position: absolute;
            bottom: 60%;
            left: 50%;
            transform: translateX(-50%) translateY(-2px);
            background-color: var(--input-bg);
            color: var(--correct-color);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .copy-wrap.show-copied .copied-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        .ema-header {
    display: inline-block;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--text-main);
    margin: 0 0 30px 0;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-color);
}

    </style>

</head>

let pinnedQuestions = new Set(JSON.parse(localStorage.getItem('pinnedQuestions') || '[]'));
const originalQuestionsOrder = allQuestions.slice();

function isPinned(n) {
    return pinnedQuestions.has(n);
}

function reorderQuestions() {
    const pinned = originalQuestionsOrder.filter(q => pinnedQuestions.has(q.n));
    const rest = originalQuestionsOrder.filter(q => !pinnedQuestions.has(q.n));
    allQuestions.length = 0;
    allQuestions.push(...pinned, ...rest);
}

function togglePin(n) {
    if (pinnedQuestions.has(n)) {
        pinnedQuestions.delete(n);
    } else {
        pinnedQuestions.add(n);
    }
    localStorage.setItem('pinnedQuestions', JSON.stringify([...pinnedQuestions]));
    reorderQuestions();
    renderQuiz();
    handleSearch();
}

function copyQuestion(btn) {
    const block = btn.closest('.q-block');
    const qTextEl = block.querySelector('.q-text');
    const optEls = block.querySelectorAll('.opts li');
    const qText = (qTextEl.dataset.original || qTextEl.textContent).trim();
    const opts = Array.from(optEls)
        .map(li => (li.dataset.original || li.textContent).trim())
        .filter(Boolean);
    const fullText = opts.length ? `${qText}\n${opts.join('\n')}` : qText;

    function showCopied() {
        const wrap = btn.closest('.copy-wrap');
        if (!wrap) return;
        wrap.classList.add('show-copied');
        setTimeout(() => wrap.classList.remove('show-copied'), 1400);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText).then(showCopied).catch(() => {
            fallbackCopy(fullText);
            showCopied();
        });
    } else {
        fallbackCopy(fullText);
        showCopied();
    }
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
}

const lectures = {
   1:  "Viral Respiratory tract Infections",
   2:  "Mycoplasma pneumoniae",
   
};
  
const lectureFilters = {
    "All": [],
    "Microbiology": [
        { label: "All",                            val: "All" },
        
        { label: "Viral Respiratory tract Infections",     val: 1 },
        { label: "Mycoplasma pneumoniae",     val: 2 },
      
    ]
};

let currentSubjectFilter = "All";  
let currentLecture = "All";

const container = document.getElementById('quiz-content');
const filterBar = document.getElementById('filter-bar');

function renderFilterBar() {
    const filters = lectureFilters[currentSubjectFilter] || lectureFilters["All"];
    filterBar.innerHTML = filters.map(f =>
        `<button class="filter-btn${f.val === currentLecture ? " active" : ""}" onclick="filterByLecture('${f.val}', this)">${f.label}</button>`
    ).join('');
}

function getLectureLabel(val) {
    if (val === "All" && currentSubjectFilter === "All") return "All";
    if (val === "All") {
        const subjectLabels = {
            "Anatomy": "Anatomy 🦴",
            "Physiology": "Physiology ⚡",
            "Microbiology": "Microbiology 🦠",
            "Pharmacology": "Pharmacology 💊",
            "Biochemistry": "Biochemistry 🧪",
            "Pathology": "Pathology 🔬",
            "Genetics": "Genetics 🧬",
            "Medical Education": "Medical Education 📗",
            "Histology": "Histology 🫁",
            "Radiology": "Radiology ☢️",
             "Medicine": "Medicine 📘",
        };
        return subjectLabels[currentSubjectFilter] || currentSubjectFilter;
    }
    return lectures[val] || val;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = "No questions found.";
            container.appendChild(noResultsMsg);
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentLecture);
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;

    if (existing) {
        existing.style.display = (count === 0) ? "none" : "flex";
        existing.querySelector('.section-heading-title').textContent = label;
        existing.querySelector('.mcq-count-badge').textContent = badgeText;
    } else if (count > 0) {
        const heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = `<span class="section-heading-title">${label}</span><span class="mcq-count-badge">${badgeText}</span>`;
        container.insertBefore(heading, container.firstChild);
    }
}

function renderQuiz() {
    container.innerHTML = '';
    allQuestions.forEach(item => {
        if (item.n === 38) {
            const emaHeader = document.createElement('div');
            emaHeader.id = 'ema-header';
            emaHeader.className = 'ema-header';
            emaHeader.style.display = 'none';
            container.appendChild(emaHeader);
        }
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.subject = item.s;
        div.dataset.lecture = item.l ?? "";
        div.dataset.qnum = item.n;
        div.dataset.searchText = (item.q + " " + item.o.join(" ")).toLowerCase();

        div.style.display = matchesFilters(item) ? "block" : "none";

        const isMulti = Array.isArray(item.a);
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        const isEssay = !item.o || item.o.length === 0 || (item.o.length === 1 && item.o[0].trim() === "");

        const iconsRowHtml = isMulti
            ? item.a.map((part, i) => {
                const label = `Answer ${letters[i] || (i + 1)}`;
                const revealText = isEssay ? part : '';
                return `
                <div class="eye-part-row">
                    <span class="eye-part-label">${letters[i] || (i + 1)}</span>
                    <button class="eye-btn" data-label="${label}" data-answer="${escapeAttr(revealText)}" data-essay="${isEssay}" data-correct="${escapeAttr(part)}" data-revealed="false" onclick="toggleAnswer(this)" title="${label}">${EYE_HIDE_SVG}</button>
                </div>`;
              }).join('') + `
                <div class="eye-part-row">
                    <div class="copy-wrap">
                        <button class="icon-btn copy-btn" onclick="copyQuestion(this)" title="Copy question">${COPY_SVG}</button>
                        <span class="copied-tooltip">Copied</span>
                    </div>
                    <button class="icon-btn pin-btn" data-pinned="${isPinned(item.n)}" onclick="togglePin(${item.n})" title="${isPinned(item.n) ? 'Unpin question' : 'Pin question'}">${isPinned(item.n) ? UNPIN_SVG : PIN_SVG}</button>
                </div>`
            : `
                <button class="eye-btn" data-label="Answer" data-answer="${escapeAttr(isEssay ? item.a : '')}" data-essay="${isEssay}" data-correct="${escapeAttr(item.a)}" data-revealed="false" onclick="toggleAnswer(this)" title="Show answer">${EYE_HIDE_SVG}</button>
                <div class="copy-wrap">
                    <button class="icon-btn copy-btn" onclick="copyQuestion(this)" title="Copy question">${COPY_SVG}</button>
                    <span class="copied-tooltip">Copied</span>
                </div>
                <button class="icon-btn pin-btn" data-pinned="${isPinned(item.n)}" onclick="togglePin(${item.n})" title="${isPinned(item.n) ? 'Unpin question' : 'Pin question'}">${isPinned(item.n) ? UNPIN_SVG : PIN_SVG}</button>`;

        div.innerHTML = `
            <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            ${isEssay ? `<div class="answer-text"></div>` : ''}
            <div class="ans-row${isMulti ? ' ans-row--multi' : ''}">
                ${iconsRowHtml}
            </div>
        `;
        container.appendChild(div);
    });
    updateEmaHeader();
    updateSectionHeading();
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
    }
    if (e.key === "Escape") {
        const takeover = document.getElementById('search-takeover-wrap');
        if (takeover && takeover.classList.contains('open')) {
            closeSearchBar();
        }
    }
});

function updateEmaHeader() {
    const emaHeader = document.getElementById('ema-header');
    if (!emaHeader) return;
    const emaBlocks = [...document.querySelectorAll('.q-block')].filter(b => {
        const qnum = parseInt(b.dataset.qnum, 10);
        return qnum >= 38 && qnum <= 49 && b.style.display !== "none";
    });
    if (emaBlocks.length === 0) {
        emaHeader.style.display = 'none';
        return;
    }
    const nums = emaBlocks.map(b => parseInt(b.dataset.qnum, 10));
    const min = Math.min(...nums);
    const max = Math.max(...nums);
    const rangeText = min === max ? `${min}` : `${min}-${max}`;
    emaHeader.textContent = `Extended Matching Questions (${rangeText}):`;
    emaHeader.style.display = 'inline-block';
}

function matchesFilters(item) {
    const subjectOk = currentSubjectFilter === "All" || item.s === currentSubjectFilter;
    const lectureOk = currentLecture === "All" || item.l === currentLecture;
    return subjectOk && lectureOk;
}

function filterByLecture(val, btn) {
    currentLecture = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    handleSearch();
}

function toggleSubjectDropdown() {
    const dd = document.getElementById('subject-dropdown');
    const btn = document.getElementById('subject-toggle-btn');
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
        dd.classList.remove('open');
        btn.classList.remove('dropdown-open');
    } else {
        dd.classList.add('open');
        btn.classList.add('dropdown-open');
    }
}

function selectSubjectFilter(subject, el) {
    currentSubjectFilter = subject;
    currentLecture = "All";
    localStorage.setItem('selectedSubject', subject);
    document.querySelectorAll('.subject-dropdown-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    renderFilterBar();
    handleSearch();
}

document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.subject-toggle-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('subject-dropdown').classList.remove('open');
        document.getElementById('subject-toggle-btn').classList.remove('dropdown-open');
    }
});

/* Premium Full Header Takeover Functions */
function toggleSearchBar() {
    const takeover = document.getElementById('search-takeover-wrap');
    const normalLeft = document.getElementById('header-normal-left');
    const normalRight = document.getElementById('header-normal-right');
    const input = document.getElementById('search-input');

    normalLeft.style.display = 'none';
    normalRight.style.display = 'none';
    takeover.classList.add('open');
    
    setTimeout(() => input.focus(), 50);
}

function closeSearchBar() {
    const takeover = document.getElementById('search-takeover-wrap');
    const normalLeft = document.getElementById('header-normal-left');
    const normalRight = document.getElementById('header-normal-right');
    const input = document.getElementById('search-input');

    takeover.classList.remove('open');
    normalLeft.style.display = 'flex';
    normalRight.style.display = 'flex';
    
    input.value = '';
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');
    blocks.forEach(block => {
        resetBlock(block);
        const subjectOk = currentSubjectFilter === "All" || block.dataset.subject === currentSubjectFilter;
        const lectureOk = currentLecture === "All" || String(block.dataset.lecture) === String(currentLecture);
        const matchesSearch = term === "" || block.dataset.searchText.includes(term);
        if (subjectOk && lectureOk && matchesSearch) {
            block.style.display = "block";
            if (term !== "") highlight(block, term);
        } else {
            block.style.display = "none";
        }
    });
    updateEmaHeader();
    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => { li.innerHTML = li.dataset.original; li.classList.remove('correct-option'); });
    block.querySelectorAll('.eye-btn').forEach(btn => {
        btn.dataset.revealed = "false";
        btn.innerHTML = EYE_HIDE_SVG;
    });
    const textEl = block.querySelector('.answer-text');
    if (textEl) {
        textEl.textContent = '';
        textEl.style.display = 'none';
    }
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function toggleAnswer(btn) {
    const isRevealed = btn.dataset.revealed !== "true";
    btn.dataset.revealed = isRevealed ? "true" : "false";
    btn.innerHTML = isRevealed ? EYE_SHOW_SVG : EYE_HIDE_SVG;

    if (btn.dataset.essay === "true") {
        const block = btn.closest('.q-block');
        const textEl = block.querySelector('.answer-text');
        if (textEl) {
            textEl.textContent = isRevealed ? btn.dataset.answer : '';
            textEl.style.display = isRevealed ? 'block' : 'none';
        }
        return;
    }

    const block = btn.closest('.q-block');
    const correctLetters = (btn.dataset.correct || '')
        .split(/[,\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

    block.querySelectorAll('.opts li').forEach(li => {
        const original = li.dataset.original || li.textContent;
        const letter = original.split('.')[0].trim();
        if (correctLetters.includes(letter)) {
            li.classList.toggle('correct-option', isRevealed);
        }
    });
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    const saved = localStorage.getItem('selectedSubject');
    if (saved && lectureFilters[saved]) {
        currentSubjectFilter = saved;
    }
    document.querySelectorAll('.subject-dropdown-item').forEach(item => {
        if (item.dataset.subject === currentSubjectFilter) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
}());

reorderQuestions();
renderFilterBar();
renderQuiz();
</script>
